<html lang="en">

<title>FiDemonlist</title>

    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111111;
        color: white;
    }
    header {
        position: relative;
        background: #1b1b1b;
        padding: 25px 20px;
        text-align: center;
        border-bottom: 2px solid #333333;
    }
    header h1 {
        margin: 0;
        font-size: 38px;
    }
    header p {
        margin: 7px 0 0;
        color: #aaaaaa;
        font-size: 15px;
    }
    .header-buttons {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        gap: 8px;
    }
    .header-button {
        padding: 11px 16px;
        border: 1px solid #444444;
        border-radius: 8px;
        background: #292929;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .header-button:hover {
        background: #383838;
    }
    .container {
        max-width: 900px;
        margin: 30px auto;
        padding: 0 20px;
    }
    .search {
        width: 100%;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #333333;
        background: #1c1c1c;
        color: white;
        font-size: 16px;
        margin-bottom: 25px;
        outline: none;
    }
    .search::placeholder {
        color: #777777;
    }
    .panel {
        display: none;
        background: #1c1c1c;
        border: 1px solid #333333;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 25px;
    }
    .panel h2 {
        margin-top: 0;
        text-align: center;
    }
    .panel-description {
        color: #aaaaaa;
        text-align: center;
    }
    .date-input {
        padding: 12px;
        border-radius: 7px;
        border: 1px solid #444444;
        background: #111111;
        color: white;
        font-size: 16px;
        margin: 10px;
    }
    .panel-buttons {
        text-align: center;
    }
    .apply-button,
    .today-button {
        padding: 12px 18px;
        border-radius: 7px;
        font-weight: bold;
        cursor: pointer;
    }
    .apply-button {
        border: none;
        background: #444444;
        color: white;
    }
    .apply-button:hover {
        background: #555555;
    }
    .today-button {
        border: 1px solid #444444;
        background: #222222;
        color: white;
        margin-left: 5px;
    }
    .today-button:hover {
        background: #333333;
    }
    .time-travel-status {
        display: none;
        text-align: center;
        color: #aaaaaa;
        margin-bottom: 20px;
        font-size: 14px;
    }
    .demon {
        background: #1c1c1c;
        border: 1px solid #333333;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        text-align: center;
    }
    .image-container {
        width: 100%;
        max-width: 600px;
        height: 280px;
        margin: 0 auto 18px auto;
        background: #333333;
        border-radius: 9px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }
    .demon-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }
    .placeholder {
        color: #aaaaaa;
        font-size: 24px;
        font-weight: bold;
    }
    .name {
        font-size: 25px;
        font-weight: bold;
        margin-bottom: 12px;
    }
    .info {
        color: #aaaaaa;
        font-size: 15px;
        margin: 6px 0;
    }
    .points {
        color: white;
        font-size: 15px;
        margin-top: 10px;
        font-weight: bold;
    }
    .victors-button {
        margin: 5px;
        padding: 10px 17px;
        border: 1px solid #444444;
        border-radius: 7px;
        background: #292929;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .victors-button:hover {
        background: #383838;
    }
    .victors-panel {
        display: none;
        margin-top: 15px;
        padding: 15px;
        background: #151515;
        border: 1px solid #333333;
        border-radius: 9px;
        text-align: left;
    }
    .victors-title {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 10px;
        text-align: center;
    }
    .victor {
        padding: 8px 0;
        border-bottom: 1px solid #292929;
        color: #dddddd;
        font-size: 15px;
    }
    .victor:last-child {
        border-bottom: none;
    }
    .leaderboard-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .player-card {
        display: flex;
        align-items: center;
        background: #222222;
        border: 1px solid #333333;
        border-radius: 10px;
        padding: 15px;
    }
    .player-rank {
        width: 55px;
        font-size: 23px;
        font-weight: bold;
        text-align: center;
    }
    .player-info {
        flex: 1;
        margin-left: 10px;
    }
    .player-name {
        font-size: 18px;
        font-weight: bold;
    }
    .player-completions {
        margin-top: 5px;
        color: #999999;
        font-size: 13px;
    }
    .player-points {
        font-size: 18px;
        font-weight: bold;
        text-align: right;
    }
    .no-demons {
        display: none;
        text-align: center;
        padding: 50px 20px;
        background: #1c1c1c;
        border: 1px solid #333333;
        border-radius: 12px;
        color: #888888;
        font-size: 18px;
    }
    /* ============================
       DEMON HISTORY
    ============================ */
    .history-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        z-index: 9999;
    }
    .history-box {
        background: #1c1c1c;
        border: 1px solid #444444;
        border-radius: 14px;
        padding: 25px;
        width: 100%;
        max-width: 700px;
        max-height: 85vh;
        overflow-y: auto;
        text-align: center;
    }
    .history-box h2 {
        margin-top: 0;
        font-size: 28px;
    }
    .history-section {
        border-top: 1px solid #333333;
        margin-top: 20px;
        padding-top: 20px;
    }
    .history-section h3 {
        margin-top: 0;
    }
    .close-history {
        margin-top: 20px;
        padding: 10px 18px;
        border: 1px solid #444444;
        border-radius: 7px;
        background: #292929;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
    .close-history:hover {
        background: #383838;
    }
    /* ============================
       POSITION HISTORY
    ============================ */
    .position-history {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 15px;
    }
    .position-entry {
        display: grid;
        grid-template-columns: 1fr 1.2fr 80px;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border-radius: 8px;
        background: #151515;
        border: 1px solid #292929;
    }
    .position-entry.higher {
        border-left: 4px solid #35c759;
    }
    .position-entry.lower {
        border-left: 4px solid #ff453a;
    }
    .position-reason {
        text-align: left;
        color: #dddddd;
        font-size: 14px;
    }
    .position-date {
        text-align: center;
        color: #aaaaaa;
        font-size: 13px;
        font-weight: bold;
    }
    .position-number {
        text-align: right;
        font-size: 18px;
        font-weight: bold;
    }
    .position-entry.higher .position-number {
        color: #35c759;
    }
    .position-entry.lower .position-number {
        color: #ff453a;
    }
    .no-history {
        color: #777777;
        font-size: 14px;
        padding: 10px;
    }
    @media (max-width: 700px) {
        header {
            padding-bottom: 85px;
        }
        header h1 {
            font-size: 30px;
        }
        .header-buttons {
            top: auto;
            bottom: 15px;
            right: 0;
            left: 0;
            transform: none;
            justify-content: center;
        }
        .header-button {
            padding: 10px 13px;
        }
        .player-card {
            padding: 12px;
        }
        .player-points {
            font-size: 15px;
        }
        .position-entry {
            grid-template-columns: 1fr;
            text-align: center;
        }
        .position-reason,
        .position-date,
        .position-number {
            text-align: center;
        }
    }

</head>

<header>

</div>
</header>

<div class="panel" id="timeTravelPanel">
    <h2>Time Travel</h2>
    <p class="panel-description">

    </p>
    <div class="panel-buttons">
        <input

            id="datePicker"

        >
        <button class="apply-button" id="applyDate">
            Travel
        </button>
        <button class="today-button" id="returnToday">
            Today
        </button>
    </div>
</div>
<!-- PLAYER LEADERBOARD -->
<div class="panel" id="leaderboardPanel">
    <h2>Player Leaderboard</h2>
    <p class="panel-description">
        Player rankings are based on completed FiDemonlist demons.
    </p>
    <div class="leaderboard-list" id="leaderboardList"></div>
</div>
<div class="time-travel-status" id="timeTravelStatus"></div>
<!-- SEARCH -->
<input
    id="search"
    class="search"
    type="text"
    placeholder="Search demons..."
>
<!-- DEMON LIST -->
<div id="demonList"></div>
<div class="no-demons" id="noDemons">
    No demons were on the list at this date.
</div>
</div>

/* =====================================================
   DATE HELPERS
===================================================== */
function getTimeAgo(date) {
    const now = new Date();
    const difference = now - date;
    const totalDays =
        Math.floor(
            difference / (1000 * 60 * 60 * 24)
        );
    const totalWeeks =
        Math.floor(totalDays / 7);
    const totalMonths =
        Math.floor(totalDays / 30.4375);
    const totalYears =
        Math.floor(totalDays / 365.2425);
    if (totalYears >= 1) {
        return totalYears +
            (
                totalYears === 1
                    ? " Year Ago"
                    : " Years Ago"
            );
    }
    if (totalMonths >= 1) {
        return totalMonths +
            (
                totalMonths === 1
                    ? " Month Ago"
                    : " Months Ago"
            );
    }
    if (totalWeeks >= 1) {
        return totalWeeks +
            (
                totalWeeks === 1
                    ? " Week Ago"
                    : " Weeks Ago"
            );
    }
    if (totalDays >= 1) {
        return totalDays +
            (
                totalDays === 1
                    ? " Day Ago"
                    : " Days Ago"
            );
    }
    return "Today";
}
/* =====================================================
   CHECK EXISTENCE
===================================================== */
function demonExists(demon, selectedDate) {
    if (selectedDate < demon.verification) {
        return false;
    }
    if (
        demon.legacyDate &&
        selectedDate >= demon.legacyDate
    ) {
        return false;
    }
    return true;
}
/* =====================================================
   AVAILABLE DEMONS
===================================================== */
function getAvailableDemons(selectedDate) {
    return masterOrder
        .map(function(name) {
            return demons.find(function(demon) {
                return demon.name === name;
            });
        })
        .filter(function(demon) {
            return demon &&
                demonExists(
                    demon,
                    selectedDate
                );
        });
}
/* =====================================================
   POINTS
===================================================== */
function getDemonPoints(demon, rank) {
    if (demon.legacyDate) {
        return demon.points;
    }
    if (
        currentRankPoints[rank] !== undefined
    ) {
        return currentRankPoints[rank];
    }
    return demon.points || 0;
}
/* =====================================================
   FORMAT DATE
===================================================== */
function formatDate(dateString) {
    return new Date(
        dateString + "T00:00:00"
    ).toLocaleDateString(
        "en-US",
        {
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );
}
/* =====================================================
   POSITION HISTORY
===================================================== */
/*
   Important:
   We calculate a demon's historical position from
   the demons that existed on each verification date.
   A history entry is ONLY created if its placement
   actually changes.
   Example:
   May 25, 2025
   Amethyst placed above
   #8
   The "reason" is the demon that caused the position
   to move.
*/
function getPositionHistory(demon) {
    const history = [];
    const allDates = demons
        .filter(function(item) {
            return item.verification >=
                demon.verification;
        })
        .map(function(item) {
            return item.verification;
        });
    allDates.sort();
    let previousPosition = null;
    let previousAvailable = false;
    for (
        let i = 0;
        i < allDates.length;
        i++
    ) {
        const date = allDates[i];
        if (date < demon.verification) {
            continue;
        }
        const available =
            getAvailableDemons(date);
        const position =
            available.findIndex(function(item) {
                return item.name === demon.name;
            }) + 1;
        if (position <= 0) {
            continue;
        }
        if (previousPosition === null) {
            previousPosition = position;
            previousAvailable = true;
            continue;
        }
        if (position === previousPosition) {
            continue;
        }
        /*
           Find the demon that caused the movement.
           If position increased:
           another demon was placed above it.
           If position decreased:
           this demon moved higher because something
           before it disappeared from the list.
        */
        let reason = "Placement changed";
        if (position > previousPosition) {
            const currentAbove =
                available[position - 2];
            if (currentAbove) {
                reason =
                    currentAbove.name +
                    " placed above";
            }
        } else {
            const previousList =
                getAvailableDemons(
                    getPreviousDate(date)
                );
            const currentList =
                available;
            const previousAbove =
                previousList
                    .slice(
                        0,
                        previousPosition - 1
                    )
                    .map(function(item) {
                        return item.name;
                    });
            const currentAbove =
                currentList
                    .slice(
                        0,
                        position - 1
                    )
                    .map(function(item) {
                        return item.name;
                    });
            const removed =
                previousAbove.find(function(name) {
                    return !currentAbove.includes(name);
                });
            if (removed) {
                reason =
                    removed +
                    " removed from list";
            }
        }
        history.push({
            date: date,
            reason: reason,
            position: position,
            direction:
                position < previousPosition
                    ? "higher"
                    : "lower"
        });
        previousPosition = position;
    }
    return history;
}
/* =====================================================
   GET PREVIOUS DATE
===================================================== */
function getPreviousDate(dateString) {
    const date =
        new Date(
            dateString + "T00:00:00"
        );
    date.setDate(
        date.getDate() - 1
    );
    return (
        date.getFullYear() +
        "-" +
        String(
            date.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            date.getDate()
        ).padStart(2, "0")
    );
}
/* =====================================================
   RENDER POSITION HISTORY
===================================================== */
function renderPositionHistory(demon) {
    const history =
        getPositionHistory(demon);
    if (history.length === 0) {
        return `
            <div class="no-history">
                No placement changes recorded.
            </div>
        `;
    }
    return history
        .map(function(entry) {
            const arrow =
                entry.direction === "higher"
                    ? "▲"
                    : "▼";
            return `
                <div class="
                    position-entry
                    ${entry.direction}
                ">
                    <div class="position-reason">
                        ${arrow} ${entry.reason}
                    </div>
                    <div class="position-date">
                        ${formatDate(entry.date)}
                    </div>
                    <div class="position-number">
                        #${entry.position}
                    </div>
                </div>
            `;
        })
        .join("");
}

/* =====================================================
   PLAYER NAME NORMALIZATION
===================================================== */
/*
   Capitalization does NOT create a new player.
   wPopoff = Wpopoff
   dovvin = Dovvin
*/
function normalizePlayerName(name) {
    const lower =
        name.toLowerCase();
    const canonicalNames = {
        "wpopoff": "wPopoff",
        "dovvin": "dovvin"
    };
    return canonicalNames[lower] || name;
}
/* =====================================================
   GET PLAYERS
===================================================== */
function getAllPlayers() {
    const playerMap =
        new Map();
    demons.forEach(
        function(demon) {
            demon.victors.forEach(
                function(victor) {
                    const canonicalName =
                        normalizePlayerName(
                            victor.name
                        );
                    if (
                        !playerMap.has(
                            canonicalName
                        )
                    ) {
                        playerMap.set(
                            canonicalName,
                            {
                                name:
                                    canonicalName,
                                country:
                                    victor.country,
                                completions:
                                    []
                            }
                        );
                    }
                    const player =
                        playerMap.get(
                            canonicalName
                        );
                    if (
                        !player.completions.includes(
                            demon.name
                        )
                    ) {
                        player.completions.push(
                            demon.name
                        );
                    }
                }
            );
        }
    );
    return Array.from(
        playerMap.values()
    );
}
/* =====================================================
   PLAYER POINTS
===================================================== */
function calculatePlayerPoints(player) {
    let total = 0;
    player.completions.forEach(
        function(completionName) {
            const demon =
                demons.find(
                    function(item) {
                        return item.name ===
                            completionName;
                    }
                );
            if (!demon) {
                return;
            }
            const currentRank =
                masterOrder.indexOf(
                    demon.name
                ) + 1;
            total += getDemonPoints(
                demon,
                currentRank
            );
        }
    );
    return total;
}
/* =====================================================
   LEADERBOARD
===================================================== */
function renderLeaderboard() {
    const leaderboard =
        document.getElementById(
            "leaderboardList"
        );
    leaderboard.innerHTML = "";
    const rankedPlayers =
        getAllPlayers()
            .map(function(player) {
                return {
                    name:
                        player.name,
                    country:
                        player.country,
                    completions:
                        player.completions,
                    points:
                        calculatePlayerPoints(
                            player
                        )
                };
            })
            .sort(function(a, b) {
                return b.points -
                    a.points;
            });
    rankedPlayers.forEach(
        function(player, index) {
            const rank =
                index + 1;
            const card =
                document.createElement(
                    "div"
                );
            card.className =
                "player-card";
            card.innerHTML = `
                <div class="player-rank">
                    #${rank}
                </div>
                <div class="player-info">
                    <div class="player-name">
                        ${player.country}
                        ${player.name}
                    </div>
                    <div class="player-completions">
                        ${player.completions.length}
                        completed demons
                    </div>
                </div>
                <div class="player-points">
                    ${player.points.toFixed(2)}
                    Points
                </div>
            `;
            leaderboard.appendChild(
                card
            );
        }
    );
}

                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );
