<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FiDemonlist</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111111;
            color: white;
        }

        header {
            background: #1b1b1b;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid #333333;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            margin: 7px 0 0;
            color: #aaaaaa;
            font-size: 15px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333333;
            background: #1c1c1c;
            color: white;
            font-size: 16px;
            margin-bottom: 25px;
            outline: none;
        }

        .search::placeholder {
            color: #777777;
        }

        .demon {
            background: #1c1c1c;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .image-container {
            width: 100%;
            max-width: 600px;
            height: 280px;
            margin: 0 auto 18px auto;

            background: #333333;
            border-radius: 9px;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .demon-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .placeholder {
            color: #aaaaaa;
            font-size: 24px;
            font-weight: bold;
        }

        .name {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .info {
            color: #aaaaaa;
            font-size: 15px;
            margin: 6px 0;
        }
    </style>
</head>

<body>

    <header>
        <h1>FiDemonlist</h1>
        <p>The Custom Geometry Dash Demonlist</p>
    </header>


    <div class="container">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search demons..."
        >


        <!-- ==========================================
             #1 BLOODBATH
        =========================================== -->

        <div class="demon" data-name="Bloodbath">

            <div class="image-container">

                <img
                    class="demon-image"
                    src="Bloodbath.jpeg"
                    alt="Bloodbath"
                    onerror="showPlaceholder(this)"
                >

            </div>

            <div class="name">
                #1 - Bloodbath
            </div>

            <div class="info">
                Created By: Riot
            </div>

            <div class="info">
                Verified By: Riot
            </div>

            <div
                class="info"
                id="bloodbath-verified"
            >
                Verified: Calculating...
            </div>

        </div>


        <!-- ==========================================
             #2 THE HELL FACTORY
        =========================================== -->

        <div class="demon" data-name="The Hell Factory">

            <div class="image-container">

                <img
                    class="demon-image"
                    src="The Hell Factory.jpeg"
                    alt="The Hell Factory"
                    onerror="showPlaceholder(this)"
                >

            </div>

            <div class="name">
                #2 - The Hell Factory
            </div>

            <div class="info">
                Created By: TeamN2
            </div>

            <div class="info">
                Verified By: Powerbomb
            </div>

            <div
                class="info"
                id="the-hell-factory-verified"
            >
                Verified: Calculating...
            </div>

        </div>

    </div>


    <script>

        // ==========================================
        // IMAGE PLACEHOLDER SYSTEM
        // ==========================================

        function showPlaceholder(image) {

            const container = image.parentElement;

            container.innerHTML =
                '<div class="placeholder">Placeholder</div>';

        }


        // ==========================================
        // AUTOMATIC TIME AGO SYSTEM
        // ==========================================

        function getTimeAgo(date) {

            const now = new Date();

            const millisecondsPerDay =
                1000 * 60 * 60 * 24;

            const difference =
                now - date;

            const totalDays =
                Math.floor(
                    difference / millisecondsPerDay
                );

            const totalWeeks =
                Math.floor(
                    totalDays / 7
                );

            const totalMonths =
                Math.floor(
                    totalDays / 30.4375
                );

            const totalYears =
                Math.floor(
                    totalDays / 365.2425
                );


            // YEARS

            if (totalYears >= 1) {

                return totalYears +
                    (
                        totalYears === 1
                            ? " Year Ago"
                            : " Years Ago"
                    );
            }


            // MONTHS

            if (totalMonths >= 1) {

                return totalMonths +
                    (
                        totalMonths === 1
                            ? " Month Ago"
                            : " Months Ago"
                    );
            }


            // WEEKS

            if (totalWeeks >= 1) {

                return totalWeeks +
                    (
                        totalWeeks === 1
                            ? " Week Ago"
                            : " Weeks Ago"
                    );
            }


            // DAYS

            if (totalDays >= 1) {

                return totalDays +
                    (
                        totalDays === 1
                            ? " Day Ago"
                            : " Days Ago"
                    );
            }


            return "Today";
        }


        // ==========================================
        // VERIFICATION DATES
        // ==========================================

        const bloodbathVerificationDate =
            new Date("2015-08-12T00:00:00");

        const theHellFactoryVerificationDate =
            new Date("2015-12-28T00:00:00");


        // ==========================================
        // UPDATE VERIFICATION TEXT
        // ==========================================

        document.getElementById(
            "bloodbath-verified"
        ).textContent =
            "Verified: " +
            getTimeAgo(
                bloodbathVerificationDate
            );


        document.getElementById(
            "the-hell-factory-verified"
        ).textContent =
            "Verified: " +
            getTimeAgo(
                theHellFactoryVerificationDate
            );


        // ==========================================
        // SEARCH SYSTEM
        // ==========================================

        const searchBox =
            document.getElementById("search");

        const demons =
            document.querySelectorAll(".demon");


        searchBox.addEventListener(
            "input",
            function() {

                const searchText =
                    searchBox.value.toLowerCase();


                demons.forEach(
                    function(demon) {

                        const demonName =
                            demon.dataset.name.toLowerCase();


                        if (
                            demonName.includes(searchText)
                        ) {

                            demon.style.display =
                                "block";

                        } else {

                            demon.style.display =
                                "none";

                        }

                    }
                );

            }
        );

    </script>

</body>
</html>
