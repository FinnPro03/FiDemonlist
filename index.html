<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiDemonlist</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    position: relative;
    background: #1b1b1b;
    padding: 25px 20px;
    text-align: center;
    border-bottom: 2px solid #333;
}

header h1 {
    margin: 0;
    font-size: 38px;
}

header p {
    margin: 7px 0 0;
    color: #aaa;
    font-size: 15px;
}

.header-buttons {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 8px;
}

.header-button {
    padding: 11px 16px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #292929;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.header-button:hover {
    background: #383838;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 20px;
}

.search {
    width: 100%;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1c1c1c;
    color: white;
    font-size: 16px;
    margin-bottom: 25px;
    outline: none;
}

.search::placeholder {
    color: #777;
}

.panel {
    display: none;
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 25px;
}

.panel h2 {
    margin-top: 0;
    text-align: center;
}

.panel-description {
    color: #aaa;
    text-align: center;
}

.date-input {
    padding: 12px;
    border-radius: 7px;
    border: 1px solid #444;
    background: #111;
    color: white;
    font-size: 16px;
    margin: 10px;
}

.panel-buttons {
    text-align: center;
}

.apply-button,
.today-button {
    padding: 12px 18px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

.apply-button {
    border: none;
    background: #444;
    color: white;
}

.apply-button:hover {
    background: #555;
}

.today-button {
    border: 1px solid #444;
    background: #222;
    color: white;
    margin-left: 5px;
}

.today-button:hover {
    background: #333;
}

.time-travel-status {
    display: none;
    text-align: center;
    color: #aaa;
    margin-bottom: 20px;
    font-size: 14px;
}

.demon {
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
}

.image-container {
    width: 100%;
    max-width: 600px;
    height: 280px;
    margin: 0 auto 18px;
    background: #333;
    border-radius: 9px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.demon-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.placeholder {
    color: #aaa;
    font-size: 24px;
    font-weight: bold;
}

.name {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 12px;
}

.info {
    color: #aaa;
    font-size: 15px;
    margin: 6px 0;
}

.points {
    color: white;
    font-size: 15px;
    margin-top: 10px;
    font-weight: bold;
}

.victors-button,
.profile-button {
    margin: 5px;
    padding: 10px 17px;
    border: 1px solid #444;
    border-radius: 7px;
    background: #292929;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.victors-button:hover,
.profile-button:hover {
    background: #383838;
}

.victors-panel {
    display: none;
    margin-top: 15px;
    padding: 15px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 9px;
    text-align: left;
}

.victors-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 10px;
    text-align: center;
}

.victor {
    padding: 8px 0;
    border-bottom: 1px solid #292929;
    color: #ddd;
    font-size: 15px;
}

.victor:last-child {
    border-bottom: none;
}

.leaderboard-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.player-card {
    display: flex;
    align-items: center;
    background: #222;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 15px;
    cursor: pointer;
    transition: background 0.15s;
}

.player-card:hover {
    background: #2b2b2b;
}

.player-rank {
    width: 55px;
    font-size: 23px;
    font-weight: bold;
    text-align: center;
}

.player-info {
    flex: 1;
    margin-left: 10px;
}

.player-name {
    font-size: 18px;
    font-weight: bold;
}

.player-completions {
    margin-top: 5px;
    color: #999;
    font-size: 13px;
}

.player-points {
    font-size: 18px;
    font-weight: bold;
    text-align: right;
}

.no-demons {
    display: none;
    text-align: center;
    padding: 50px 20px;
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 12px;
    color: #888;
    font-size: 18px;
}

.profile-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.78);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 9999;
}

.profile-box {
    background: #1c1c1c;
    border: 1px solid #444;
    border-radius: 14px;
    padding: 25px;
    width: 100%;
    max-width: 600px;
    max-height: 85vh;
    overflow-y: auto;
    text-align: center;
}

.profile-box h2 {
    margin-top: 0;
    font-size: 30px;
}

.profile-country {
    font-size: 24px;
    margin-bottom: 5px;
}

.profile-stat {
    color: #aaa;
    margin: 8px 0;
}

.profile-section {
    border-top: 1px solid #333;
    margin-top: 20px;
    padding-top: 20px;
}

.completion-item {
    padding: 9px 0;
    border-bottom: 1px solid #292929;
    color: #ddd;
}

.close-profile {
    margin-top: 20px;
    padding: 10px 18px;
    border: 1px solid #444;
    border-radius: 7px;
    background: #292929;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.close-profile:hover {
    background: #383838;
}

@media (max-width: 700px) {
    header {
        padding-bottom: 85px;
    }

    header h1 {
        font-size: 30px;
    }

    .header-buttons {
        top: auto;
        bottom: 15px;
        right: 0;
        left: 0;
        transform: none;
        justify-content: center;
    }

    .header-button {
        padding: 10px 13px;
    }

    .player-card {
        padding: 12px;
    }

    .player-points {
        font-size: 15px;
    }
}
</style>
</head>

<header>

    </div>
</div>

<div class="panel" id="leaderboardPanel">

</div>

<div class="time-travel-status" id="timeTravelStatus"></div>

<div id="demonList"></div>

/* =====================================================
   TIME AGO
===================================================== */

function getTimeAgo(date) {

    const now = new Date();
    const difference = now - date;

    const totalDays =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );

    const totalWeeks =
        Math.floor(totalDays / 7);

    const totalMonths =
        Math.floor(totalDays / 30.4375);

    const totalYears =
        Math.floor(totalDays / 365.2425);

    if (totalYears >= 1) {
        return totalYears +
            (totalYears === 1
                ? " Year Ago"
                : " Years Ago");
    }

    if (totalMonths >= 1) {
        return totalMonths +
            (totalMonths === 1
                ? " Month Ago"
                : " Months Ago");
    }

    if (totalWeeks >= 1) {
        return totalWeeks +
            (totalWeeks === 1
                ? " Week Ago"
                : " Weeks Ago");
    }

    if (totalDays >= 1) {
        return totalDays +
            (totalDays === 1
                ? " Day Ago"
                : " Days Ago");
    }

    return "Today";
}

/* =====================================================
   DEMON EXISTS
===================================================== */

function demonExists(demon, selectedDate) {

    if (selectedDate < demon.verification) {
        return false;
    }

    return true;
}

/* =====================================================
   AVAILABLE DEMONS
===================================================== */

function getAvailableDemons(selectedDate) {

    return masterOrder
        .map(name =>
            demons.find(demon =>
                demon.name === name
            )
        )
        .filter(demon =>
            demon &&
            demonExists(
                demon,
                selectedDate
            )
        );
}

/* =====================================================
   POINTS
===================================================== */

function getDemonPoints(demon, rank) {

    if (
        currentRankPoints[rank] !== undefined
    ) {
        return currentRankPoints[rank];
    }

    return demon.points || 0;
}

/* =====================================================
   PLAYER NAME NORMALIZATION
===================================================== */

const canonicalNames = {

    "wpopoff": "wPopoff",
    "dovvin": "dovvin",
    "weyolll3": "weyolll3",
    "eastshark": "eastshark",

    "karkito": "karkito"
};

function getCanonicalPlayerName(name) {

    const key =
        name.toLowerCase();

    return canonicalNames[key] || name;
}

/* =====================================================
   GET PLAYERS
===================================================== */

function getAllPlayers() {

    const playerMap = new Map();

    demons.forEach(
        function(demon) {

            demon.victors.forEach(
                function(victor) {

                    const canonicalName =
                        getCanonicalPlayerName(
                            victor.name
                        );

                    const key =
                        canonicalName.toLowerCase();

                    if (
                        !playerMap.has(key)
                    ) {

                        playerMap.set(
                            key,
                            {
                                name:
                                    canonicalName,

                                country:
                                    victor.country,

                                completions:
                                    []
                            }
                        );
                    }

                    const player =
                        playerMap.get(key);

                    if (
                        !player.completions.includes(
                            demon.name
                        )
                    ) {

                        player.completions.push(
                            demon.name
                        );
                    }

                }
            );
        }
    );

    return Array.from(
        playerMap.values()
    );
}

/* =====================================================
   PLAYER POINTS
===================================================== */

function calculatePlayerPoints(player) {

    let total = 0;

    player.completions.forEach(
        function(completionName) {

            const demon =
                demons.find(
                    item =>
                        item.name ===
                        completionName
                );

            if (!demon) {
                return;
            }

            const currentRank =
                masterOrder.indexOf(
                    demon.name
                ) + 1;

            total +=
                getDemonPoints(
                    demon,
                    currentRank
                );
        }
    );

    return total;
}

/* =====================================================
   PLAYER PROFILE
===================================================== */

function showPlayerProfile(playerName) {

    const players =
        getAllPlayers();

    const player =
        players.find(
            item =>
                item.name.toLowerCase() ===
                playerName.toLowerCase()
        );

    if (!player) {
        return;
    }

    const existing =
        document.getElementById(
            "profileOverlay"
        );

    if (existing) {
        existing.remove();
    }

    const overlay =
        document.createElement("div");

    overlay.id = "profileOverlay";
    overlay.className =
        "profile-overlay";

    const box =
        document.createElement("div");

    box.className =
        "profile-box";

    const points =
        calculatePlayerPoints(player);

    const completionHTML =
        player.completions.map(
            function(levelName) {

                return `
                    <div class="completion-item">
                        ${levelName}
                    </div>
                `;

            }
        ).join("");

    box.innerHTML = `

        <div class="profile-country">
            ${player.country}
        </div>

        <h2>
            ${player.name}
        </h2>

        <div class="profile-stat">
            ${player.completions.length}
            completed demons
        </div>

        <div class="profile-stat">
            ${points.toFixed(2)}
            total points
        </div>

        <div class="profile-section">

            <h3>
                🏆 Completions
            </h3>

            ${completionHTML}

        </div>

        <button
            class="close-profile"
            id="closeProfile"
        >
            Close
        </button>
    `;

    overlay.appendChild(box);

    document.body.appendChild(overlay);

    document.getElementById(
        "closeProfile"
    ).onclick =
        function() {

            overlay.remove();

        };

    overlay.onclick =
        function(event) {

            if (
                event.target === overlay
            ) {

                overlay.remove();

            }

        };
}

/* =====================================================
   LEADERBOARD
===================================================== */

function renderLeaderboard() {

    const leaderboard =
        document.getElementById(
            "leaderboardList"
        );

    leaderboard.innerHTML = "";

    const rankedPlayers =
        getAllPlayers()
            .map(
                function(player) {

                    return {

                        name:
                            player.name,

                        country:
                            player.country,

                        completions:
                            player.completions,

                        points:
                            calculatePlayerPoints(
                                player
                            )
                    };

                }
            )
            .sort(
                function(a, b) {

                    if (
                        b.points !==
                        a.points
                    ) {

                        return (
                            b.points -
                            a.points
                        );

                    }

                    return (
                        b.completions.length -
                        a.completions.length
                    );
                }
            );

    rankedPlayers.forEach(
        function(player, index) {

            const rank =
                index + 1;

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "player-card";

            card.onclick =
                function() {

                    showPlayerProfile(
                        player.name
                    );

                };

            card.innerHTML = `

                <div class="player-rank">
                    #${rank}
                </div>

                <div class="player-info">

                    <div class="player-name">
                        ${player.country}
                        ${player.name}
                    </div>

                    <div class="player-completions">
                        ${player.completions.length}
                        completed demons
                    </div>

                </div>

                <div class="player-points">
                    ${player.points.toFixed(2)}
                    Points
                </div>
            `;

            leaderboard.appendChild(card);
        }
    );
}

            timeTravelPanel.style.display ===
            "block"
        ) {

            timeTravelPanel.style.display =
                "none";

        } else {

            timeTravelPanel.style.display =
                "block";

            leaderboardPanel.style.display =
                "none";

        }

    }
);

/* =====================================================
   LEADERBOARD BUTTON
===================================================== */

leaderboardButton.addEventListener(
    "click",
    function() {

        if (
            leaderboardPanel.style.display ===
            "block"
        ) {

            leaderboardPanel.style.display =
                "none";

        } else {

            leaderboardPanel.style.display =
                "block";

            timeTravelPanel.style.display =
                "none";

            renderLeaderboard();

        }

    }
);

/* =====================================================
   TRAVEL
===================================================== */

function travelToDate(selectedDate) {

    renderList(selectedDate);

    const status =
        document.getElementById(
            "timeTravelStatus"
        );

    if (
        selectedDate ===
        todayString
    ) {

        status.style.display =
            "none";

    } else {

        const date =
            new Date(
                selectedDate +
                "T00:00:00"
            );

        const formatted =
            date.toLocaleDateString(
                "en-US",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );

        status.style.display =
            "block";

        status.textContent =
            "Viewing the FiDemonlist from " +
            formatted;
    }

    document.getElementById(
        "search"
    ).value = "";
}

/* =====================================================
   APPLY DATE
===================================================== */

document.getElementById(
    "applyDate"
).addEventListener(
    "click",
    function() {

        if (
            datePicker.value
        ) {

            travelToDate(
                datePicker.value
            );

        }

    }
);

/* =====================================================
   TODAY
===================================================== */

document.getElementById(
    "returnToday"
).addEventListener(
    "click",
    function() {

        datePicker.value =
            todayString;

        travelToDate(
            todayString
        );

    }
);

/* =====================================================
   SEARCH
===================================================== */

document.getElementById(
    "search"
).addEventListener(
    "input",
    function() {

        const text =
            this.value.toLowerCase();

        const cards =
            document.querySelectorAll(
                "#demonList .demon"
            );

        cards.forEach(
            function(card) {

                const name =
                    card.dataset.name
                        .toLowerCase();

                card.style.display =
                    name.includes(text)
                        ? "block"
                        : "none";

            }
        );

    }
);

/* =====================================================
   START
===================================================== */

travelToDate(todayString);
renderLeaderboard();

</script>

</body>
</html>
