<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiDemonlist</title>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111111;
        color: white;
    }
    header {
        position: relative;
        background: #1b1b1b;
        padding: 25px 20px;
        text-align: center;
        border-bottom: 2px solid #333333;
    }
    header h1 {
        margin: 0;
        font-size: 38px;
    }
    header p {
        margin: 7px 0 0;
        color: #aaaaaa;
        font-size: 15px;
    }
    .header-buttons {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        gap: 8px;
    }
    .header-button {
        padding: 11px 16px;
        border: 1px solid #444444;
        border-radius: 8px;
        background: #292929;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .header-button:hover {
        background: #383838;
    }
    .container {
        max-width: 900px;
        margin: 30px auto;
        padding: 0 20px;
    }
    .search {
        width: 100%;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #333333;
        background: #1c1c1c;
        color: white;
        font-size: 16px;
        margin-bottom: 25px;
        outline: none;
    }
    .search::placeholder {
        color: #777777;
    }
    .panel {
        display: none;
        background: #1c1c1c;
        border: 1px solid #333333;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 25px;
    }
    .panel h2 {
        margin-top: 0;
        text-align: center;
    }
    .panel-description {
        color: #aaaaaa;
        text-align: center;
    }
    .date-input {
        padding: 12px;
        border-radius: 7px;
        border: 1px solid #444444;
        background: #111111;
        color: white;
        font-size: 16px;
        margin: 10px;
    }
    .panel-buttons {
        text-align: center;
    }
    .apply-button,
    .today-button {
        padding: 12px 18px;
        border-radius: 7px;
        font-weight: bold;
        cursor: pointer;
    }
    .apply-button {
        border: none;
        background: #444444;
        color: white;
    }
    .apply-button:hover {
        background: #555555;
    }
    .today-button {
        border: 1px solid #444444;
        background: #222222;
        color: white;
        margin-left: 5px;
    }
    .today-button:hover {
        background: #333333;
    }
    .time-travel-status {
        display: none;
        text-align: center;
        color: #aaaaaa;
        margin-bottom: 20px;
        font-size: 14px;
    }
    .demon {
        background: #1c1c1c;
        border: 1px solid #333333;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        text-align: center;
    }
    .image-container {
        width: 100%;
        max-width: 600px;
        height: 280px;
        margin: 0 auto 18px auto;
        background: #333333;
        border-radius: 9px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }
    .demon-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }
    .placeholder {
        color: #aaaaaa;
        font-size: 24px;
        font-weight: bold;
    }
    .name {
        font-size: 25px;
        font-weight: bold;
        margin-bottom: 12px;
    }
    .info {
        color: #aaaaaa;
        font-size: 15px;
        margin: 6px 0;
    }
    .points {
        color: white;
        font-size: 15px;
        margin-top: 10px;
        font-weight: bold;
    }
    .victors-button {
        margin: 5px;
        padding: 10px 17px;
        border: 1px solid #444444;
        border-radius: 7px;
        background: #292929;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .victors-button:hover {
        background: #383838;
    }
    .victors-panel {
        display: none;
        margin-top: 15px;
        padding: 15px;
        background: #151515;
        border: 1px solid #333333;
        border-radius: 9px;
        text-align: left;
    }
    .victors-title {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 10px;
        text-align: center;
    }
    .victor {
        padding: 8px 0;
        border-bottom: 1px solid #292929;
        color: #dddddd;
        font-size: 15px;
    }
    .victor:last-child {
        border-bottom: none;
    }
    .leaderboard-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .player-card {
        display: flex;
        align-items: center;
        background: #222222;
        border: 1px solid #333333;
        border-radius: 10px;
        padding: 15px;
    }
    .player-rank {
        width: 55px;
        font-size: 23px;
        font-weight: bold;
        text-align: center;
    }
    .player-info {
        flex: 1;
        margin-left: 10px;
    }
    .player-name {
        font-size: 18px;
        font-weight: bold;
    }
    .player-completions {
        margin-top: 5px;
        color: #999999;
        font-size: 13px;
    }
    .player-points {
        font-size: 18px;
        font-weight: bold;
        text-align: right;
    }
    .no-demons {
        display: none;
        text-align: center;
        padding: 50px 20px;
        background: #1c1c1c;
        border: 1px solid #333333;
        border-radius: 12px;
        color: #888888;
        font-size: 18px;
    }
    /* ============================
       DEMON HISTORY
    ============================ */
    .history-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        z-index: 9999;
    }
    .history-box {
        background: #1c1c1c;
        border: 1px solid #444444;
        border-radius: 14px;
        padding: 25px;
        width: 100%;
        max-width: 650px;
        max-height: 85vh;
        overflow-y: auto;
    }
    .history-box h2 {
        margin-top: 0;
        font-size: 28px;
        text-align: center;
    }
    .history-section {
        border-top: 1px solid #333333;
        margin-top: 20px;
        padding-top: 20px;
    }
    .history-section h3 {
        margin-top: 0;
        text-align: center;
    }
    .placement-event {
        margin-bottom: 12px;
        padding: 14px;
        border-radius: 9px;
        background: #151515;
        border: 1px solid #333333;
    }
    .placement-date {
        text-align: center;
        font-weight: bold;
        color: white;
        margin-bottom: 12px;
    }
    .placement-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        padding: 10px 12px;
        border-radius: 7px;
    }
    .placement-reason {
        flex: 1;
        text-align: left;
        font-size: 14px;
    }
    .placement-position {
        min-width: 55px;
        text-align: right;
        font-size: 18px;
        font-weight: bold;
    }
    .placement-new {
        background: rgba(180, 150, 0, 0.18);
        border-left: 4px solid #d6b600;
    }
    .placement-higher {
        background: rgba(0, 150, 60, 0.18);
        border-left: 4px solid #22aa66;
    }
    .placement-lower {
        background: rgba(190, 40, 40, 0.18);
        border-left: 4px solid #cc4444;
    }
    .placement-new .placement-reason {
        color: #e0c900;
    }
    .placement-higher .placement-reason {
        color: #44cc88;
    }
    .placement-lower .placement-reason {
        color: #ee6666;
    }
    .close-history {
        display: block;
        margin: 20px auto 0;
        padding: 10px 18px;
        border: 1px solid #444444;
        border-radius: 7px;
        background: #292929;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
    .close-history:hover {
        background: #383838;
    }
    @media (max-width: 700px) {
        header {
            padding-bottom: 85px;
        }
        header h1 {
            font-size: 30px;
        }
        .header-buttons {
            top: auto;
            bottom: 15px;
            right: 0;
            left: 0;
            transform: none;
            justify-content: center;
        }
        .header-button {
            padding: 10px 13px;
        }
        .player-card {
            padding: 12px;
        }
        .player-points {
            font-size: 15px;
        }
        .placement-row {
            gap: 8px;
        }
        .placement-reason {
            font-size: 13px;
        }
    }
</style>
</head>
<body>
<header>
<h1>FiDemonlist</h1>
<p>
    The Custom Geometry Dash Demonlist
</p>
<div class="header-buttons">
    <button
        class="header-button"
        id="timeTravelButton"
    >
        Time Travel
    </button>
    <button
        class="header-button"
        id="leaderboardButton"
    >
        Player Leaderboard
    </button>
</div>
</header>
<div class="container">
<!-- ============================
     TIME TRAVEL
============================ -->
<div
    class="panel"
    id="timeTravelPanel"
>
    <h2>Time Travel</h2>
    <p class="panel-description">
        Choose a date to see the FiDemonlist from that date.
    </p>
    <div class="panel-buttons">
        <input
            type="date"
            id="datePicker"
            class="date-input"
        >
        <button
            class="apply-button"
            id="applyDate"
        >
            Travel
        </button>
        <button
            class="today-button"
            id="returnToday"
        >
            Today
        </button>
    </div>
</div>
<!-- ============================
     PLAYER LEADERBOARD
============================ -->
<div
    class="panel"
    id="leaderboardPanel"
>
    <h2>Player Leaderboard</h2>
    <p class="panel-description">
        Player rankings are based on completed FiDemonlist demons.
    </p>
    <div
        class="leaderboard-list"
        id="leaderboardList"
    ></div>
</div>
<div
    class="time-travel-status"
    id="timeTravelStatus"
></div>
<!-- ============================
     SEARCH
============================ -->
<input
    id="search"
    class="search"
    type="text"
    placeholder="Search demons..."
>
<!-- ============================
     DEMON LIST
============================ -->
<div id="demonList"></div>
<div
    class="no-demons"
    id="noDemons"
>
    No demons were on the list at this date.
</div>
</div>

/* =====================================================
   TIME AGO
===================================================== */
function getTimeAgo(date) {
    const now = new Date();
    const difference = now - date;
    const totalDays =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );
    const totalWeeks =
        Math.floor(totalDays / 7);
    const totalMonths =
        Math.floor(totalDays / 30.4375);
    const totalYears =
        Math.floor(totalDays / 365.2425);
    if (totalYears >= 1) {
        return totalYears +
            (
                totalYears === 1
                    ? " Year Ago"
                    : " Years Ago"
            );
    }
    if (totalMonths >= 1) {
        return totalMonths +
            (
                totalMonths === 1
                    ? " Month Ago"
                    : " Months Ago"
            );
    }
    if (totalWeeks >= 1) {
        return totalWeeks +
            (
                totalWeeks === 1
                    ? " Week Ago"
                    : " Weeks Ago"
            );
    }
    if (totalDays >= 1) {
        return totalDays +
            (
                totalDays === 1
                    ? " Day Ago"
                    : " Days Ago"
            );
    }
    return "Today";
}
/* =====================================================
   CHECK IF DEMON EXISTS
===================================================== */
function demonExists(
    demon,
    selectedDate
) {
    if (
        selectedDate <
        demon.verification
    ) {
        return false;
    }
    if (
        demon.legacyDate &&
        selectedDate >=
        demon.legacyDate
    ) {
        return false;
    }
    return true;
}
/* =====================================================
   GET AVAILABLE DEMONS
===================================================== */
function getAvailableDemons(
    selectedDate
) {
    return masterOrder
        .map(
            function(name) {
                return demons.find(
                    function(demon) {
                        return demon.name === name;
                    }
                );
            }
        )
        .filter(
            function(demon) {
                return demon &&
                    demonExists(
                        demon,
                        selectedDate
                    );
            }
        );
}
/* =====================================================
   GET DEMON POINTS
===================================================== */
function getDemonPoints(
    demon,
    rank
) {
    if (
        demon.legacyDate
    ) {
        return demon.points;
    }
    return demon.points ||
        currentRankPoints[rank] ||
        0;
}
/* =====================================================
   GET HISTORICAL PLACEMENT
===================================================== */
function getHistoricalPlacement(
    demon,
    selectedDate
) {
    const available =
        getAvailableDemons(
            selectedDate
        );
    const index =
        available.findIndex(
            function(item) {
                return item.name ===
                    demon.name;
            }
        );
    if (index === -1) {
        return null;
    }
    return index + 1;
}
/* =====================================================
   GET DATE STRING
===================================================== */
function formatDate(
    dateString
) {
    return new Date(
        dateString + "T00:00:00"
    ).toLocaleDateString(
        "en-US",
        {
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );
}
/* =====================================================
   GET PLACEMENT EVENTS
=====================================================
   This creates history ONLY when a level's
   placement actually changes.
   It compares the list before and after
   every verification date.
===================================================== */
function getPlacementHistory(
    demon
) {
    const events = [];
    const allDates =
        [...new Set(
            demons
                .map(
                    function(item) {
                        return item.verification;
                    }
                )
        )]
        .sort();
    let previousPosition = null;
    for (
        let i = 0;
        i < allDates.length;
        i++
    ) {
        const date =
            allDates[i];
        const beforeDate =
            new Date(
                date + "T00:00:00"
            );
        beforeDate.setDate(
            beforeDate.getDate() - 1
        );
        const beforeString =
            beforeDate
                .toISOString()
                .split("T")[0];
        const oldPosition =
            getHistoricalPlacement(
                demon,
                beforeString
            );
        const newPosition =
            getHistoricalPlacement(
                demon,
                date
            );
        if (
            newPosition === null
        ) {
            continue;
        }
        /*
         * The demon itself is being placed.
         */
        if (
            oldPosition === null
        ) {
            const placedDemons =
                demons.filter(
                    function(other) {
                        return (
                            other.verification === date &&
                            other.name !== demon.name &&
                            getHistoricalPlacement(
                                other,
                                date
                            ) !== null
                        );
                    }
                );
            let reason =
                "Level Placed";
            if (
                placedDemons.length > 0
            ) {
                reason =
                    "Placed alongside: " +
                    placedDemons
                        .map(
                            function(other) {
                                return other.name;
                            }
                        )
                        .join(", ");
            }
            events.push({
                date: date,
                oldPosition: null,
                newPosition: newPosition,
                type: "new",
                reason: reason
            });
            previousPosition =
                newPosition;
            continue;
        }
        /*
         * Only create an event if
         * the actual position changed.
         */
        if (
            oldPosition !==
            newPosition
        ) {
            const changedLevels = [];
            demons.forEach(
                function(other) {
                    if (
                        other.name ===
                        demon.name
                    ) {
                        return;
                    }
                    const oldOther =
                        getHistoricalPlacement(
                            other,
                            beforeString
                        );
                    const newOther =
                        getHistoricalPlacement(
                            other,
                            date
                        );
                    if (
                        oldOther === null ||
                        newOther === null
                    ) {
                        return;
                    }
                    if (
                        oldOther !==
                        newOther
                    ) {
                        /*
                         * This other level changed
                         * because of its new placement
                         * on this date.
                         */
                        if (
                            other.verification ===
                            date
                        ) {
                            changedLevels.push(
                                other.name
                            );
                        }
                    }
                }
            );
            const uniqueChangedLevels =
                [...new Set(
                    changedLevels
                )];
            let reason;
            if (
                uniqueChangedLevels.length > 0
            ) {
                reason =
                    uniqueChangedLevels.join(
                        ", "
                    ) +
                    (
                        uniqueChangedLevels.length === 1
                            ? " Placed Above"
                            : " Placed Above"
                    );
            } else {
                reason =
                    "List Placement Changed";
            }
            events.push({
                date: date,
                oldPosition:
                    oldPosition,
                newPosition:
                    newPosition,
                type:
                    newPosition <
                    oldPosition
                        ? "higher"
                        : "lower",
                reason:
                    reason
            });
            previousPosition =
                newPosition;
        }
    }
    return events;
}
/* =====================================================
   RENDER PLACEMENT HISTORY
===================================================== */
function renderPlacementHistory(
    demon
) {
    const events =
        getPlacementHistory(
            demon
        );
    if (
        events.length === 0
    ) {
        return `
            <div class="info">
                No placement changes recorded.
            </div>
        `;
    }
    return events
        .map(
            function(event) {
                let positionText =
                    "#" +
                    event.newPosition;
                let className =
                    "placement-new";
                if (
                    event.type ===
                    "higher"
                ) {
                    className =
                        "placement-higher";
                }
                if (
                    event.type ===
                    "lower"
                ) {
                    className =
                        "placement-lower";
                }
                return `
                    <div class="placement-event">
                        <div class="placement-date">
                            ${formatDate(event.date)}
                        </div>
                        <div
                            class="placement-row ${className}"
                        >
                            <div class="placement-reason">
                                ${event.reason}
                            </div>
                            <div class="placement-position">
                                ${positionText}
                            </div>
                        </div>
                    </div>
                `;
            }
        )
        .join("");
}

        :
        demon.victors.map(
            function(victor) {

                `;

        function(event) {
            if (
                event.target === overlay

                overlay.remove();
            }
        };
}
/* =====================================================
   GET PLAYERS
=====================================================
   Names are compared case-insensitively,
   while the first/correct spelling stored
   for each player is preserved.
===================================================== */
function getAllPlayers() {
    const playerMap =
        new Map();
    demons.forEach(
        function(demon) {
            demon.victors.forEach(
                function(victor) {
                    const key =
                        victor.name
                            .trim()
                            .toLowerCase();
                    if (
                        !playerMap.has(key)
                    ) {
                        playerMap.set(
                            key,
                            {
                                name:
                                    victor.name,
                                country:
                                    victor.country,
                                completions:
                                    []
                            }
                        );
                    }
                    const player =
                        playerMap.get(
                            key
                        );
                    /*
                     * Keep the newest spelling
                     * supplied in the database.
                     */
                    player.name =
                        victor.name;
                    player.country =
                        victor.country;
                    if (
                        !player.completions.includes(
                            demon.name
                        )
                    ) {
                        player.completions.push(
                            demon.name
                        );
                    }
                }
            );
        }
    );
    return Array.from(
        playerMap.values()
    );
}
/* =====================================================
   PLAYER POINTS
===================================================== */
function calculatePlayerPoints(
    player
) {
    let total = 0;
    player.completions.forEach(
        function(completionName) {
            const demon =
                demons.find(
                    function(item) {
                        return item.name ===
                            completionName;
                    }
                );
            if (!demon) {
                return;
            }
            /*
             * A player's points are based on
             * the demon's CURRENT list points.
             */
            total +=
                demon.points || 0;
        }
    );
    return total;
}
/* =====================================================
   LEADERBOARD
===================================================== */
function renderLeaderboard() {
    const leaderboard =
        document.getElementById(
            "leaderboardList"
        );
    leaderboard.innerHTML = "";
    const rankedPlayers =
        getAllPlayers()
            .map(
                function(player) {
                    return {
                        name:
                            player.name,
                        country:
                            player.country,
                        completions:
                            player.completions,
                        points:
                            calculatePlayerPoints(
                                player
                            )
                    };
                }
            )
            .sort(
                function(a, b) {
                    return b.points -
                        a.points;
                }
            );
    rankedPlayers.forEach(
        function(player, index) {
            const rank =
                index + 1;
            const card =
                document.createElement(
                    "div"
                );
            card.className =
                "player-card";
            card.innerHTML = `
                <div class="player-rank">
                    #${rank}
                </div>
                <div class="player-info">
                    <div class="player-name">
                        ${player.country}
                        ${player.name}
                    </div>
                    <div class="player-completions">
                        ${player.completions.length}
                        completed demons
                    </div>
                </div>
                <div class="player-points">
                    ${player.points.toFixed(2)}
                    Points
                </div>
            `;
            leaderboard.appendChild(
                card
            );
        }
    );
}
