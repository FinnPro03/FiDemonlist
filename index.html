<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FiDemonlist</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111111;
            color: white;
        }

        header {
            position: relative;
            background: #1b1b1b;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid #333333;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            margin: 7px 0 0;
            color: #aaaaaa;
            font-size: 15px;
        }

        .time-travel-button {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);

            padding: 11px 16px;

            border: 1px solid #444444;
            border-radius: 8px;

            background: #292929;
            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .time-travel-button:hover {
            background: #383838;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search {
            width: 100%;
            box-sizing: border-box;

            padding: 15px;

            border-radius: 8px;
            border: 1px solid #333333;

            background: #1c1c1c;
            color: white;

            font-size: 16px;

            margin-bottom: 25px;

            outline: none;
        }

        .search::placeholder {
            color: #777777;
        }

        .time-travel-panel {
            display: none;

            background: #1c1c1c;

            border: 1px solid #333333;
            border-radius: 12px;

            padding: 20px;

            margin-bottom: 25px;

            text-align: center;
        }

        .time-travel-panel h2 {
            margin-top: 0;
        }

        .time-travel-panel p {
            color: #aaaaaa;
        }

        .date-input {
            padding: 12px;

            border-radius: 7px;
            border: 1px solid #444444;

            background: #111111;
            color: white;

            font-size: 16px;

            margin: 10px;
        }

        .apply-button,
        .today-button {
            padding: 12px 18px;

            border-radius: 7px;

            font-weight: bold;

            cursor: pointer;
        }

        .apply-button {
            border: none;
            background: #444444;
            color: white;
        }

        .apply-button:hover {
            background: #555555;
        }

        .today-button {
            border: 1px solid #444444;
            background: #222222;
            color: white;

            margin-left: 5px;
        }

        .today-button:hover {
            background: #333333;
        }

        .time-travel-status {
            display: none;

            text-align: center;

            color: #aaaaaa;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .demon {
            background: #1c1c1c;

            border: 1px solid #333333;
            border-radius: 12px;

            padding: 20px;

            margin-bottom: 20px;

            text-align: center;
        }

        .image-container {
            width: 100%;
            max-width: 600px;

            height: 280px;

            margin: 0 auto 18px auto;

            background: #333333;

            border-radius: 9px;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .demon-image {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }

        .placeholder {
            color: #aaaaaa;

            font-size: 24px;
            font-weight: bold;
        }

        .name {
            font-size: 25px;

            font-weight: bold;

            margin-bottom: 12px;
        }

        .info {
            color: #aaaaaa;

            font-size: 15px;

            margin: 6px 0;
        }

        .no-demons {
            display: none;

            text-align: center;

            padding: 50px 20px;

            background: #1c1c1c;

            border: 1px solid #333333;

            border-radius: 12px;

            color: #888888;

            font-size: 18px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 30px;
            }

            .time-travel-button {
                position: static;

                transform: none;

                margin-top: 15px;
            }

            .date-input {
                width: 80%;

                margin: 10px auto;
            }

            .apply-button,
            .today-button {
                margin: 5px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>FiDemonlist</h1>

    <p>
        The Custom Geometry Dash Demonlist
    </p>

    <button
        class="time-travel-button"
        id="timeTravelButton"
    >
        Time Travel
    </button>

</header>



<div class="container">


    <!-- TIME TRAVEL -->

    <div
        class="time-travel-panel"
        id="timeTravelPanel"
    >

        <h2>Time Travel</h2>

        <p>
            Choose a date to see the FiDemonlist from that date.
        </p>

        <input
            type="date"
            id="datePicker"
            class="date-input"
        >

        <button
            class="apply-button"
            id="applyDate"
        >
            Travel
        </button>

        <button
            class="today-button"
            id="returnToday"
        >
            Today
        </button>

    </div>


    <div
        class="time-travel-status"
        id="timeTravelStatus"
    ></div>


    <!-- SEARCH -->

    <input
        id="search"
        class="search"
        type="text"
        placeholder="Search demons..."
    >


    <!-- LIST -->

    <div id="demonList"></div>


    <div
        class="no-demons"
        id="noDemons"
    >
        No demons were on the list at this date.
    </div>

</div>



<script>


/* =====================================================
   DEMON DATABASE
===================================================== */

const demons = [

    {
        name: "Bloodbath",

        createdBy: "Riot",

        verifiedBy: "Riot",

        verification: "2015-08-12",

        legacyDate: "2021-01-01",

        image: "Bloodbath.jpeg"
    },


    {
        name: "The Hell Factory",

        createdBy: "TeamN2",

        verifiedBy: "Powerbomb",

        verification: "2015-12-28",

        legacyDate: "2021-01-01",

        image: "The Hell Factory.jpeg"
    },


    {
        name: "Tidal Wave",

        createdBy: "OniLink",

        verifiedBy: "Zoink",

        verification: "2023-09-09",

        image: "Tidal Wave.jpeg"
    },


    {
        name: "Thinking Space II",

        createdBy: "CairoX",

        verifiedBy: "Zoink",

        verification: "2025-05-25",

        image: "Thinking Space II.jpeg"
    },


    {
        name: "Amethyst",

        createdBy: "iMist",

        verifiedBy: "Wpopoff",

        verification: "2025-05-25",

        image: "Amethyst.jpeg"
    },


    {
        name: "Flamewall",

        createdBy: "Narwall",

        verifiedBy: "Cuatrocientos",

        verification: "2025-09-21",

        image: "Flamewall.jpeg"
    },


    {
        name: "Society",

        createdBy: "Neomarbilan",

        verifiedBy: "Wpopoff",

        verification: "2026-06-20",

        image: "Society.jpeg"
    }

];



/* =====================================================
   MASTER ORDER
=====================================================

   THIS IS THE CURRENT ORDER.

   Historical rankings are NOT stored here.

   The website takes this order and removes
   demons that didn't exist yet or were already
   legacy.

===================================================== */

const masterOrder = [

    "Society",

    "Thinking Space II",

    "Amethyst",

    "Flamewall",

    "Tidal Wave",

    "Bloodbath",

    "The Hell Factory"

];



/* =====================================================
   TIME AGO
===================================================== */

function getTimeAgo(date) {

    const now =
        new Date();


    const difference =
        now - date;


    const totalDays =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const totalWeeks =
        Math.floor(
            totalDays / 7
        );


    const totalMonths =
        Math.floor(
            totalDays / 30.4375
        );


    const totalYears =
        Math.floor(
            totalDays / 365.2425
        );


    if (totalYears >= 1) {

        return totalYears +
            (
                totalYears === 1
                    ? " Year Ago"
                    : " Years Ago"
            );

    }


    if (totalMonths >= 1) {

        return totalMonths +
            (
                totalMonths === 1
                    ? " Month Ago"
                    : " Months Ago"
            );

    }


    if (totalWeeks >= 1) {

        return totalWeeks +
            (
                totalWeeks === 1
                    ? " Week Ago"
                    : " Weeks Ago"
            );

    }


    if (totalDays >= 1) {

        return totalDays +
            (
                totalDays === 1
                    ? " Day Ago"
                    : " Days Ago"
            );

    }


    return "Today";

}



/* =====================================================
   CHECK IF DEMON EXISTS ON DATE
===================================================== */

function demonExists(
    demon,
    selectedDate
) {

    /*
       Demon hasn't been verified yet.
    */

    if (
        selectedDate <
        demon.verification
    ) {

        return false;

    }


    /*
       Legacy demon has already
       left the list.
    */

    if (
        demon.legacyDate &&
        selectedDate >=
        demon.legacyDate
    ) {

        return false;

    }


    return true;

}



/* =====================================================
   GET CURRENT ORDER FOR DATE
===================================================== */

function getOrderForDate(
    selectedDate
) {

    /*
       Start with the CURRENT order.

       Then remove anything that didn't
       exist at the selected date.
    */

    return masterOrder.filter(
        function(name) {

            const demon =
                demons.find(
                    function(item) {

                        return item.name ===
                            name;

                    }
                );


            if (!demon) {

                return false;

            }


            return demonExists(
                demon,
                selectedDate
            );

        }
    );

}



/* =====================================================
   RENDER LIST
===================================================== */

function renderList(
    selectedDate
) {

    const list =
        document.getElementById(
            "demonList"
        );


    list.innerHTML = "";


    const noDemons =
        document.getElementById(
            "noDemons"
        );


    const order =
        getOrderForDate(
            selectedDate
        );


    if (
        order.length === 0
    ) {

        noDemons.style.display =
            "block";

        return;

    }


    noDemons.style.display =
        "none";


    /*
       IMPORTANT:

       The rank is generated HERE.

       That means the first demon
       remaining is #1, second is #2,
       etc.

       We are NOT copying today's
       number.
    */

    order.forEach(
        function(name, index) {

            const demon =
                demons.find(
                    function(item) {

                        return item.name ===
                            name;

                    }
                );


            const rank =
                index + 1;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "demon";


            card.dataset.name =
                demon.name;


            card.innerHTML = `

                <div class="image-container">

                    <img
                        class="demon-image"
                        src="${demon.image}"
                        alt="${demon.name}"
                    >

                </div>

                <div class="name">
                    #${rank} - ${demon.name}
                </div>

                <div class="info">
                    Created By: ${demon.createdBy}
                </div>

                <div class="info">
                    Verified By: ${demon.verifiedBy}
                </div>

                <div class="info">
                    Verified: ${getTimeAgo(
                        new Date(
                            demon.verification +
                            "T00:00:00"
                        )
                    )}
                </div>

            `;


            const image =
                card.querySelector(
                    ".demon-image"
                );


            image.onerror =
                function() {

                    const container =
                        image.parentElement;


                    container.innerHTML =
                        '<div class="placeholder">Placeholder</div>';

                };


            list.appendChild(
                card
            );

        }
    );

}



/* =====================================================
   DATE SETTINGS
===================================================== */

const firstDate =
    "2015-01-01";


const today =
    new Date();


const todayString =
    today.getFullYear() +
    "-" +
    String(
        today.getMonth() + 1
    ).padStart(2, "0") +
    "-" +
    String(
        today.getDate()
    ).padStart(2, "0");


const datePicker =
    document.getElementById(
        "datePicker"
    );


datePicker.min =
    firstDate;


datePicker.max =
    todayString;


datePicker.value =
    todayString;



/* =====================================================
   TIME TRAVEL BUTTON
===================================================== */

const timeTravelButton =
    document.getElementById(
        "timeTravelButton"
    );


const timeTravelPanel =
    document.getElementById(
        "timeTravelPanel"
    );


timeTravelButton.addEventListener(
    "click",
    function() {

        if (
            timeTravelPanel.style.display ===
            "block"
        ) {

            timeTravelPanel.style.display =
                "none";

        } else {

            timeTravelPanel.style.display =
                "block";

        }

    }
);



/* =====================================================
   TRAVEL TO DATE
===================================================== */

function travelToDate(
    selectedDate
) {

    renderList(
        selectedDate
    );


    const status =
        document.getElementById(
            "timeTravelStatus"
        );


    if (
        selectedDate ===
        todayString
    ) {

        status.style.display =
            "none";

    } else {

        const date =
            new Date(
                selectedDate +
                "T00:00:00"
            );


        const formatted =
            date.toLocaleDateString(
                "en-US",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );


        status.style.display =
            "block";


        status.textContent =
            "Viewing the FiDemonlist from " +
            formatted;

    }


    document.getElementById(
        "search"
    ).value = "";

}



/* =====================================================
   TRAVEL
===================================================== */

document.getElementById(
    "applyDate"
).addEventListener(
    "click",
    function() {

        if (
            datePicker.value
        ) {

            travelToDate(
                datePicker.value
            );

        }

    }
);



/* =====================================================
   RETURN TO TODAY
===================================================== */

document.getElementById(
    "returnToday"
).addEventListener(
    "click",
    function() {

        datePicker.value =
            todayString;


        travelToDate(
            todayString
        );

    }
);



/* =====================================================
   SEARCH
===================================================== */

document.getElementById(
    "search"
).addEventListener(
    "input",
    function() {

        const text =
            this.value.toLowerCase();


        const cards =
            document.querySelectorAll(
                "#demonList .demon"
            );


        cards.forEach(
            function(card) {

                const name =
                    card.dataset.name
                        .toLowerCase();


                if (
                    name.includes(text)
                ) {

                    card.style.display =
                        "block";

                } else {

                    card.style.display =
                        "none";

                }

            }
        );

    }
);



/* =====================================================
   START TODAY
===================================================== */

travelToDate(
    todayString
);

</script>

</body>
</html>
