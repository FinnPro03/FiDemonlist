/* =====================================================
   TIME AGO
===================================================== */

function getTimeAgo(date) {

    const now = new Date();
    const difference = now - date;

    const totalDays =
        Math.floor(
            difference / 86400000
        );

    const totalWeeks =
        Math.floor(totalDays / 7);

    const totalMonths =
        Math.floor(totalDays / 30.4375);

    const totalYears =
        Math.floor(totalDays / 365.2425);


    if (totalYears >= 1) {

        return totalYears +
            (
                totalYears === 1
                    ? " Year Ago"
                    : " Years Ago"
            );

    }

    if (totalMonths >= 1) {

        return totalMonths +
            (
                totalMonths === 1
                    ? " Month Ago"
                    : " Months Ago"
            );

    }

    if (totalWeeks >= 1) {

        return totalWeeks +
            (
                totalWeeks === 1
                    ? " Week Ago"
                    : " Weeks Ago"
            );

    }

    if (totalDays >= 1) {

        return totalDays +
            (
                totalDays === 1
                    ? " Day Ago"
                    : " Days Ago"
            );

    }

    return "Today";

}


/* =====================================================
   DATE HELPERS
===================================================== */

function dateToNumber(date) {

    return new Date(
        date + "T00:00:00"
    ).getTime();

}


/* =====================================================
   DEMON EXISTS
===================================================== */

function demonExists(demon, selectedDate) {

    const selected =
        dateToNumber(selectedDate);

    const verification =
        dateToNumber(demon.verification);


    if (selected < verification) {
        return false;
    }


    if (
        demon.legacyDate &&
        selected >=
        dateToNumber(demon.legacyDate)
    ) {

        return false;

    }


    return true;

}


/* =====================================================
   AVAILABLE DEMONS
===================================================== */

function getAvailableDemons(selectedDate) {

    return masterOrder
        .map(name =>
            demons.find(
                demon =>
                    demon.name === name
            )
        )
        .filter(
            demon =>
                demon &&
                demonExists(
                    demon,
                    selectedDate
                )
        );

}


/* =====================================================
   GET DEMON POINTS
===================================================== */

function getDemonPoints(demon, rank) {

    if (
        demon.name === "Bloodbath"
    ) return 18.65;

    if (
        demon.name === "The Hell Factory"
    ) return 18.10;

    if (
        demon.name === "The Ultimate Phase"
    ) return 17.50;

    if (
        demon.name === "Cataclysm"
    ) return 17.00;


    if (
        currentRankPoints[rank] !== undefined
    ) {

        return currentRankPoints[rank];

    }


    return demon.points || 0;

}


/* =====================================================
   POSITION AT A DATE
===================================================== */

function getDemonPosition(
    demonName,
    date
) {

    const list =
        getAvailableDemons(date);

    const index =
        list.findIndex(
            demon =>
                demon.name === demonName
        );


    if (index === -1) {
        return null;
    }


    return index + 1;

}


/* =====================================================
   FIND WHAT CAME ABOVE
===================================================== */

/*
   This is the important part.

   We compare the previous position to the
   new position.

   If the demon moved DOWN, every newly-added
   demon that is now above it is listed.

   If multiple demons were added on the same
   date, ALL of them are included.
*/

function getPlacementChanges(
    demon,
    date
) {

    const currentPosition =
        getDemonPosition(
            demon.name,
            date
        );


    if (currentPosition === null) {
        return null;
    }


    const verificationDate =
        new Date(
            demon.verification +
            "T00:00:00"
        );


    /*
       A demon's first appearance is always
       a yellow "Placed" event.
    */

    if (
        date ===
        demon.verification
    ) {

        return {
            type: "placed",
            oldPosition: null,
            newPosition: currentPosition,
            causes: []
        };

    }


    /*
       Look through every earlier date where
       something could have entered the list.
    */

    let previousDate = null;


    const possibleDates =
        demons
            .filter(
                other =>
                    other.name !== demon.name &&
                    other.verification < date &&
                    demonExists(
                        other,
                        date
                    )
            )
            .map(
                other =>
                    other.verification
            )
            .sort();


    /*
       The latest verification date before
       the selected date is the relevant
       previous list state.
    */

    const uniqueDates =
        [...new Set(possibleDates)];


    if (uniqueDates.length > 0) {

        previousDate =
            uniqueDates[
                uniqueDates.length - 1
            ];

    }


    if (!previousDate) {
        return null;
    }


    const oldPosition =
        getDemonPosition(
            demon.name,
            previousDate
        );


    if (oldPosition === null) {
        return null;
    }


    if (
        oldPosition ===
        currentPosition
    ) {

        return null;

    }


    /*
       Find demons that were NOT above the
       selected demon before, but ARE above
       it now.
    */

    const causes = [];


    getAvailableDemons(date)
        .forEach(
            function(other) {

                if (
                    other.name ===
                    demon.name
                ) {
                    return;
                }


                const newPos =
                    getDemonPosition(
                        other.name,
                        date
                    );


                const oldPos =
                    getDemonPosition(
                        other.name,
                        previousDate
                    );


                if (
                    newPos !== null &&
                    newPos < currentPosition &&
                    (
                        oldPos === null ||
                        oldPos > oldPosition
                    )
                ) {

                    causes.push(
                        other.name
                    );

                }

            }
        );


    return {

        type:
            currentPosition <
            oldPosition
                ? "higher"
                : "lower",

        oldPosition,
        newPosition:
            currentPosition,

        causes

    };

}


/* =====================================================
   GET COMPLETE POSITION HISTORY
===================================================== */

function getPositionHistory(demon) {

    const events = [];


    /*
       Every verification date can create
       a placement change.

       We check every date in the database
       because multiple demons can be verified
       on the same date.
    */

    const dates =
        [...new Set(
            demons
                .map(
                    item =>
                        item.verification
                )
                .filter(
                    date =>
                        date >=
                        demon.verification
                )
                .sort()
        )];


    let lastPosition = null;


    dates.forEach(
        function(date) {

            const position =
                getDemonPosition(
                    demon.name,
                    date
                );


            if (position === null) {
                return;
            }


            if (lastPosition === null) {

                events.push({

                    date,
                    type: "placed",
                    oldPosition: null,
                    newPosition: position,
                    causes: []

                });

                lastPosition =
                    position;

                return;

            }


            if (
                position ===
                lastPosition
            ) {

                return;

            }


            const causes = [];


            /*
               Find exactly which demons appeared
               between the previous position and this
               position.

               This prevents the same demon being
               incorrectly shown twice.
            */

            const before =
                getAvailableDemons(
                    getPreviousDate(
                        date
                    )
                );


            const after =
                getAvailableDemons(
                    date
                );


            after.forEach(
                function(other) {

                    if (
                        other.name ===
                        demon.name
                    ) {
                        return;
                    }


                    const beforeIndex =
                        before.findIndex(
                            item =>
                                item.name ===
                                other.name
                        );


                    const afterIndex =
                        after.findIndex(
                            item =>
                                item.name ===
                                other.name
                        );


                    if (
                        afterIndex <
                        position - 1 &&
                        (
                            beforeIndex === -1 ||
                            beforeIndex >=
                            lastPosition
                        )
                    ) {

                        causes.push(
                            other.name
                        );

                    }

                }
            );


            events.push({

                date,
                type:
                    position <
                    lastPosition
                        ? "higher"
                        : "lower",

                oldPosition:
                    lastPosition,

                newPosition:
                    position,

                causes:
                    [...new Set(causes)]

            });


            lastPosition =
                position;

        }
    );


    return events;

}


/* =====================================================
   PREVIOUS DATE
===================================================== */

function getPreviousDate(date) {

    const earlierDates =
        demons
            .map(
                demon =>
                    demon.verification
            )
            .filter(
                verification =>
                    verification < date
            )
            .sort();


    if (
        earlierDates.length === 0
    ) {

        return date;

    }


    return earlierDates[
        earlierDates.length - 1
    ];

}

            `;


            const image =
                card.querySelector(
                    ".demon-image"
                );


            image.onerror =
                function() {

                    image.parentElement.innerHTML =
                        '<div class="placeholder">Placeholder</div>';

                };


            list.appendChild(
                card
            );

        }
    );

}

/* =====================================================
   FORMAT HISTORY DATE
===================================================== */

function formatHistoryDate(date) {

    return new Date(
        date +
        "T00:00:00"
    ).toLocaleDateString(
        "en-US",
        {
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );

}


/* =====================================================
   DEMON HISTORY
===================================================== */

function showDemonHistory(demonName) {

    const demon =
        demons.find(
            item =>
                item.name ===
                demonName
        );


    if (!demon) {
        return;
    }


    const oldOverlay =
        document.getElementById(
            "historyOverlay"
        );


    if (oldOverlay) {
        oldOverlay.remove();
    }


    const overlay =
        document.createElement(
            "div"
        );


    overlay.id =
        "historyOverlay";


    overlay.className =
        "history-overlay";


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "history-box";


    const verificationDate =
        new Date(
            demon.verification +
            "T00:00:00"
        );


    const formattedVerification =
        verificationDate.toLocaleDateString(
            "en-US",
            {
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        );


    let legacyHTML = "";


    if (demon.legacyDate) {

        legacyHTML = `

            <div class="info">
                🏛️ Became Legacy:
                ${formatHistoryDate(
                    demon.legacyDate
                )}
            </div>

        `;

    } else {

        legacyHTML = `

            <div class="info">
                🟢 Currently Active
            </div>

        `;

    }


    const victorsHTML =
        demon.victors.length === 0

        ?

        `
        <div class="info">
            No recorded victors.
        </div>
        `

        :

        demon.victors
            .map(
                victor => `
                    <div class="victor">
                        ${victor.country}
                        ${victor.name}
                    </div>
                `
            )
            .join("");


    const history =
        getPositionHistory(
            demon
        );


    let historyHTML = "";


    if (
        history.length === 0
    ) {

        historyHTML = `

            <div class="info">
                No placement changes recorded.
            </div>

        `;

    } else {

        historyHTML =
            history
                .map(
                    function(event) {

                        let eventClass =
                            "history-placed";


                        let reasonHTML =
                            `

                            <div class="history-reason">
                                ${demon.name} placed
                            </div>

                        `;


                        if (
                            event.type ===
                            "higher"
                        ) {

                            eventClass =
                                "history-higher";


                            reasonHTML =
                                event.causes.length > 0

                                ?

                                event.causes
                                    .map(
                                        cause => `
                                            <div class="history-reason">
                                                ${cause} placed above it
                                            </div>
                                        `
                                    )
                                    .join("")

                                :

                                `
                                <div class="history-reason">
                                    Placement moved higher
                                </div>
                                `;

                        }


                        if (
                            event.type ===
                            "lower"
                        ) {

                            eventClass =
                                "history-lower";


                            reasonHTML =
                                event.causes.length > 0

                                ?

                                event.causes
                                    .map(
                                        cause => `
                                            <div class="history-reason">
                                                ${cause} placed above it
                                            </div>
                                        `
                                    )
                                    .join("")

                                :

                                `
                                <div class="history-reason">
                                    Placement moved lower
                                </div>
                                `;

                        }


                        return `

                            <div class="history-entry ${eventClass}">

                                <div class="history-date">
                                    ${formatHistoryDate(
                                        event.date
                                    )}
                                </div>

                                <div class="history-row">

                                    <div class="history-left">

                                        ${reasonHTML}

                                    </div>

                                    <div class="history-right">

                                        #${event.newPosition}

                                    </div>

                                </div>

                            </div>

                        `;

                    }
                )
                .join("");

    }


    box.innerHTML = `

        <h2>
            ${demon.name}
        </h2>

        <div class="info">
            Created By: ${demon.createdBy}
        </div>

        <div class="info">
            Verified By: ${demon.verifiedBy}
        </div>

        <div class="info">
            📅 Verified: ${formattedVerification}
        </div>

        ${legacyHTML}

        <div class="points">
            List Points: ${demon.points.toFixed(2)}
        </div>

        <div class="history-section">

            <h3>
                🏆 Victors
            </h3>

            ${victorsHTML}

        </div>

        <div class="history-section">

            <h3>
                📜 Placement History
            </h3>

            <div class="history-list">

                ${historyHTML}

            </div>

        </div>

        <button
            class="close-history"
            id="closeHistory"
        >
            Close
        </button>

    `;


    overlay.appendChild(
        box
    );


    document.body.appendChild(
        overlay
    );


    document.getElementById(
        "closeHistory"
    ).onclick =
        function() {

            overlay.remove();

        };


    overlay.onclick =
        function(event) {

            if (
                event.target ===
                overlay
            ) {

                overlay.remove();

            }

        };

}


/* =====================================================
   PLAYERS
===================================================== */

function getAllPlayers() {

    const playerMap =
        new Map();


    demons.forEach(
        function(demon) {

            demon.victors.forEach(
                function(victor) {

                    const key =
                        victor.name
                            .toLowerCase();


                    if (
                        !playerMap.has(key)
                    ) {

                        playerMap.set(
                            key,
                            {
                                name:
                                    victor.name,

                                country:
                                    victor.country,

                                completions:
                                    []
                            }
                        );

                    }


                    const player =
                        playerMap.get(key);


                    if (
                        !player.completions
                            .includes(
                                demon.name
                            )
                    ) {

                        player.completions.push(
                            demon.name
                        );

                    }

                }
            );

        }
    );


    return Array.from(
        playerMap.values()
    );

}


/* =====================================================
   PLAYER POINTS
===================================================== */

function calculatePlayerPoints(player) {

    let total = 0;


    player.completions.forEach(
        function(completionName) {

            const demon =
                demons.find(
                    item =>
                        item.name ===
                        completionName
                );


            if (!demon) {
                return;
            }


            const currentRank =
                masterOrder.indexOf(
                    demon.name
                ) + 1;


            total +=
                getDemonPoints(
                    demon,
                    currentRank
                );

        }
    );


    return total;

}


/* =====================================================
   LEADERBOARD
===================================================== */

function renderLeaderboard() {

    const leaderboard =
        document.getElementById(
            "leaderboardList"
        );


    leaderboard.innerHTML = "";


    const rankedPlayers =
        getAllPlayers()
            .map(
                player => ({

                    name:
                        player.name,

                    country:
                        player.country,

                    completions:
                        player.completions,

                    points:
                        calculatePlayerPoints(
                            player
                        )

                })
            )
            .sort(
                (a, b) =>
                    b.points -
                    a.points
            );


    rankedPlayers.forEach(
        function(player, index) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "player-card";


            card.innerHTML = `

                <div class="player-rank">
                    #${index + 1}
                </div>

                <div class="player-info">

                    <div class="player-name">
                        ${player.country}
                        ${player.name}
                    </div>

                    <div class="player-completions">
                        ${player.completions.length}
                        completed demons
                    </div>

                </div>

                <div class="player-points">
                    ${player.points.toFixed(2)}
                    Points
                </div>

            `;


            leaderboard.appendChild(
                card
            );

        }
    );

}
