<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FiDemonlist</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111111;
            color: white;
        }

        header {
            position: relative;
            background: #1b1b1b;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid #333333;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            margin: 7px 0 0;
            color: #aaaaaa;
            font-size: 15px;
        }

        .header-buttons {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 8px;
        }

        .header-button {
            padding: 11px 16px;
            border: 1px solid #444444;
            border-radius: 8px;
            background: #292929;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .header-button:hover {
            background: #383838;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333333;
            background: #1c1c1c;
            color: white;
            font-size: 16px;
            margin-bottom: 25px;
            outline: none;
        }

        .search::placeholder {
            color: #777777;
        }

        .panel {
            display: none;
            background: #1c1c1c;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .panel h2 {
            margin-top: 0;
            text-align: center;
        }

        .panel-description {
            color: #aaaaaa;
            text-align: center;
        }

        .date-input {
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #444444;
            background: #111111;
            color: white;
            font-size: 16px;
            margin: 10px;
        }

        .panel-buttons {
            text-align: center;
        }

        .apply-button,
        .today-button {
            padding: 12px 18px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .apply-button {
            border: none;
            background: #444444;
            color: white;
        }

        .apply-button:hover {
            background: #555555;
        }

        .today-button {
            border: 1px solid #444444;
            background: #222222;
            color: white;
            margin-left: 5px;
        }

        .today-button:hover {
            background: #333333;
        }

        .time-travel-status {
            display: none;
            text-align: center;
            color: #aaaaaa;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .demon {
            background: #1c1c1c;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .image-container {
            width: 100%;
            max-width: 600px;
            height: 280px;
            margin: 0 auto 18px auto;
            background: #333333;
            border-radius: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .demon-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .placeholder {
            color: #aaaaaa;
            font-size: 24px;
            font-weight: bold;
        }

        .name {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .info {
            color: #aaaaaa;
            font-size: 15px;
            margin: 6px 0;
        }

        .points {
            color: white;
            font-size: 15px;
            margin-top: 10px;
            font-weight: bold;
        }

        .victors-button {
            margin: 5px;
            padding: 10px 17px;
            border: 1px solid #444444;
            border-radius: 7px;
            background: #292929;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .victors-button:hover {
            background: #383838;
        }

        .victors-panel {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #151515;
            border: 1px solid #333333;
            border-radius: 9px;
            text-align: left;
        }

        .victors-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .victor {
            padding: 8px 0;
            border-bottom: 1px solid #292929;
            color: #dddddd;
            font-size: 15px;
        }

        .victor:last-child {
            border-bottom: none;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-card {
            display: flex;
            align-items: center;
            background: #222222;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 15px;
        }

        .player-rank {
            width: 55px;
            font-size: 23px;
            font-weight: bold;
            text-align: center;
        }

        .player-info {
            flex: 1;
            margin-left: 10px;
        }

        .player-name {
            font-size: 18px;
            font-weight: bold;
        }

        .player-completions {
            margin-top: 5px;
            color: #999999;
            font-size: 13px;
        }

        .player-points {
            font-size: 18px;
            font-weight: bold;
            text-align: right;
        }

        .no-demons {
            display: none;
            text-align: center;
            padding: 50px 20px;
            background: #1c1c1c;
            border: 1px solid #333333;
            border-radius: 12px;
            color: #888888;
            font-size: 18px;
        }

        /* ============================
           HISTORY
        ============================ */

        .history-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 9999;
        }

        .history-box {
            background: #1c1c1c;
            border: 1px solid #444444;
            border-radius: 14px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
        }

        .history-box h2 {
            margin-top: 0;
            font-size: 28px;
        }

        .history-section {
            border-top: 1px solid #333333;
            margin-top: 20px;
            padding-top: 20px;
        }

        .history-section h3 {
            margin-top: 0;
        }

        .history-entry {
            padding: 10px;
            margin: 8px 0;
            background: #151515;
            border-radius: 8px;
            color: #dddddd;
        }

        .history-date {
            font-weight: bold;
            color: white;
        }

        .history-position {
            color: #aaaaaa;
            margin-top: 4px;
        }

        .close-history {
            margin-top: 20px;
            padding: 10px 18px;
            border: 1px solid #444444;
            border-radius: 7px;
            background: #292929;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .close-history:hover {
            background: #383838;
        }

        @media (max-width: 700px) {

            header {
                padding-bottom: 85px;
            }

            header h1 {
                font-size: 30px;
            }

            .header-buttons {
                top: auto;
                bottom: 15px;
                right: 0;
                left: 0;
                transform: none;
                justify-content: center;
            }

            .header-button {
                padding: 10px 13px;
            }

            .player-card {
                padding: 12px;
            }

            .player-points {
                font-size: 15px;
            }

        }

    </style>

</head>

<header>

    <p>
        The Custom Geometry Dash Demonlist
    </p>

        <button

            Player Leaderboard
        </button>

    </div>

</header>

    ============================ -->

        <p class="panel-description">

        </p>

        <div class="panel-buttons">

            <input

                id="datePicker"
                class="date-input"
            >

            <button

            >
                Travel
            </button>

            <button

                id="returnToday"
            >
                Today
            </button>

        </div>

    </div>


    <!-- ============================
         PLAYER LEADERBOARD
    ============================ -->

    <div
        class="panel"
        id="leaderboardPanel"
    >

        <h2>Player Leaderboard</h2>

        <p class="panel-description">
            Player rankings are based on completed FiDemonlist demons.
        </p>

        <div
            class="leaderboard-list"
            id="leaderboardList"
        ></div>

    </div>


    <div
        class="time-travel-status"
        id="timeTravelStatus"
    ></div>


    <!-- ============================
         SEARCH
    ============================ -->

    <input
        id="search"
        class="search"
        type="text"
        placeholder="Search demons..."
    >


    <!-- ============================
         DEMON LIST
    ============================ -->

    <div id="demonList"></div>


    <div
        class="no-demons"
        id="noDemons"
    >
        No demons were on the list at this date.
    </div>

</div>

/* =====================================================
   TIME AGO
===================================================== */

function getTimeAgo(date) {

    const now = new Date();

    const difference = now - date;

    const totalDays =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );

    const totalWeeks =
        Math.floor(
            totalDays / 7
        );

    const totalMonths =
        Math.floor(
            totalDays / 30.4375
        );

    const totalYears =
        Math.floor(
            totalDays / 365.2425
        );


    if (totalYears >= 1) {

        return totalYears +
            (
                totalYears === 1
                    ? " Year Ago"
                    : " Years Ago"
            );

    }


    if (totalMonths >= 1) {

        return totalMonths +
            (
                totalMonths === 1
                    ? " Month Ago"
                    : " Months Ago"
            );

    }


    if (totalWeeks >= 1) {

        return totalWeeks +
            (
                totalWeeks === 1
                    ? " Week Ago"
                    : " Weeks Ago"
            );

    }


    if (totalDays >= 1) {

        return totalDays +
            (
                totalDays === 1
                    ? " Day Ago"
                    : " Days Ago"
            );

    }


    return "Today";

}


/* =====================================================
   CHECK IF DEMON EXISTS
===================================================== */

function demonExists(
    demon,
    selectedDate
) {

    if (
        selectedDate <
        demon.verification
    ) {

        return false;

    }


    /*
     * Legacy demons disappear once their
     * legacy date is reached.
     */

    if (
        demon.legacyDate &&
        selectedDate >=
        demon.legacyDate
    ) {

        return false;

    }


    return true;

}


/* =====================================================
   GET AVAILABLE DEMONS
===================================================== */

function getAvailableDemons(
    selectedDate
) {

    return masterOrder
        .map(function(name) {

            return demons.find(
                function(demon) {

                    return demon.name === name;

                }
            );

        })
        .filter(function(demon) {

            return demon &&
                demonExists(
                    demon,
                    selectedDate
                );

        });

}


/* =====================================================
   GET DEMON POINTS
===================================================== */

function getDemonPoints(
    demon,
    rank
) {

    /*
     * Legacy points stay fixed.
     */

    if (demon.name === "Bloodbath") {
        return 18.65;
    }

    if (demon.name === "The Hell Factory") {
        return 18.10;
    }

    if (demon.name === "The Ultimate Phase") {
        return 17.50;
    }

    if (demon.name === "Cataclysm") {
        return 17.00;
    }


    /*
     * Active demon points are based on
     * their current FiDemonlist rank.
     */

    if (
        currentRankPoints[rank] !== undefined
    ) {

        return currentRankPoints[rank];

    }


    return demon.points || 0;

}

/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
    dateString
) {

    return new Date(
        dateString +
        "T00:00:00"
    ).toLocaleDateString(
        "en-US",
        {
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );

}


/* =====================================================
   BUILD POSITION HISTORY
=====================================================

   This does NOT make an entry for every date.

   It checks every important date when the list
   changed and ONLY records the demon if its
   position actually changed.

   Example:

   #4 → #4

   does NOT get added.

   #4 → #3

   DOES get added.
===================================================== */

function getPositionHistory(
    demon
) {

    const importantDates = [];


    /*
     * Start with every verification date.
     */

    demons.forEach(function(item) {

        importantDates.push(
            item.verification
        );


        if (item.legacyDate) {

            importantDates.push(
                item.legacyDate
            );

        }

    });


    /*
     * Sort and remove duplicates.
     */

    const uniqueDates =
        [...new Set(
            importantDates
        )].sort();


    const history = [];

    let previousPosition = null;


    uniqueDates.forEach(
        function(date) {

            const available =
                getAvailableDemons(
                    date
                );


            const position =
                available.findIndex(
                    function(item) {

                        return item.name ===
                            demon.name;

                    }
                );


            /*
             * -1 means the demon wasn't on
             * the list yet.
             */

            const currentPosition =
                position === -1
                    ? null
                    : position + 1;


            /*
             * Only add a history entry when
             * the actual position changes.
             */

            if (
                currentPosition !==
                previousPosition
            ) {

                if (
                    currentPosition !== null
                ) {

                    history.push({

                        date: date,

                        position:
                            currentPosition

                    });

                }

                previousPosition =
                    currentPosition;

            }

        }
    );


    return history;

}


/* =====================================================
   DEMON HISTORY
===================================================== */

function showDemonHistory(
    demonName
) {

    const demon =
        demons.find(
            function(item) {

                return item.name ===
                    demonName;

            }
        );


    if (!demon) {
        return;
    }


    const existing =
        document.getElementById(
            "historyOverlay"
        );


    if (existing) {
        existing.remove();
    }


    const overlay =
        document.createElement(
            "div"
        );


    overlay.id =
        "historyOverlay";


    overlay.className =
        "history-overlay";


    const history =
        document.createElement(
            "div"
        );


    history.className =
        "history-box";


    const verificationDate =
        new Date(
            demon.verification +
            "T00:00:00"
        );


    const formattedVerification =
        verificationDate.toLocaleDateString(
            "en-US",
            {
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        );


    let legacyHTML = "";


    if (demon.legacyDate) {

        legacyHTML = `

            <div class="info">
                🏛️ Became Legacy:
                ${formatDate(
                    demon.legacyDate
                )}
            </div>

        `;

    } else {

        legacyHTML = `

            <div class="info">
                🟢 Currently Active
            </div>

        `;

    }


    const victorsHTML =
        demon.victors.length === 0

        ?

        `
            <div class="info">
                No recorded victors.
            </div>
        `

        :

        demon.victors.map(
            function(victor) {

                return `

                    <div class="victor">

                        ${victor.country}
                        ${victor.name}

                    </div>

                `;

            }
        ).join("");


    /*
     * Position history.
     */

    const positionHistory =
        getPositionHistory(
            demon
        );


    let positionHistoryHTML = "";


    if (
        positionHistory.length === 0
    ) {

        positionHistoryHTML = `

            <div class="info">
                No placement changes recorded.
            </div>

        `;

    } else {

        positionHistoryHTML =
            positionHistory.map(
                function(entry) {

                    return `

                        <div class="history-entry">

                            <div class="history-date">
                                ${formatDate(
                                    entry.date
                                )}
                            </div>

                            <div class="history-position">
                                #${entry.position}
                            </div>

                        </div>

                    `;

                }
            ).join("");

    }


    history.innerHTML = `

        <h2>
            ${demon.name}
        </h2>


        <div class="info">
            Created By: ${demon.createdBy}
        </div>


        <div class="info">
            Verified By: ${demon.verifiedBy}
        </div>


        <div class="info">
            📅 Verified:
            ${formattedVerification}
        </div>


        ${legacyHTML}


        <div class="points">
            List Points: ${demon.points.toFixed(2)}
        </div>


        <div class="history-section">

            <h3>
                🏆 Victors
            </h3>

            ${victorsHTML}

        </div>


        <div class="history-section">

            <h3>
                📊 Placement History
            </h3>

            ${positionHistoryHTML}

        </div>


        <div class="history-section">

            <h3>
                📜 Timeline
            </h3>


            <div class="info">
                ${formattedVerification}
                — Demon verified
            </div>


            ${
                demon.legacyDate

                ?

                `

                    <div class="info">

                        ${formatDate(
                            demon.legacyDate
                        )}

                        — Became Legacy

                    </div>

                `

                :

                `

                    <div class="info">
                        Currently on the FiDemonlist
                    </div>

                `

            }

        </div>


        <button
            class="close-history"
            id="closeHistory"
        >
            Close
        </button>

    `;


    overlay.appendChild(
        history
    );


    document.body.appendChild(
        overlay
    );


    document.getElementById(
        "closeHistory"
    ).onclick =
        function() {

            overlay.remove();

        };


    overlay.onclick =
        function(event) {

            if (
                event.target === overlay
            ) {

                overlay.remove();

            }

        };

}


/* =====================================================
   PLAYER NAME NORMALIZATION
=====================================================

   Case does not create duplicate players.

   Wpopoff / wpopoff / WPOPOFF
   → wPopoff

   Dovvin / dovvin / DOVVIN
   → dovvin
===================================================== */

function getCanonicalPlayerName(
    name
) {

    const lowerName =
        name.toLowerCase();


    if (
        lowerName === "wpopoff"
    ) {

        return "wPopoff";

    }


    if (
        lowerName === "dovvin"
    ) {

        return "dovvin";

    }


    return name;

}


/* =====================================================
   GET ALL PLAYERS
===================================================== */

function getAllPlayers() {

    const playerMap =
        new Map();


    /*
     * IMPORTANT:
     *
     * We use the COMPLETE demon database here.
     *
     * Time Travel does NOT affect the leaderboard.
     */

    demons.forEach(
        function(demon) {

            if (
                !demon.victors ||
                demon.victors.length === 0
            ) {

                return;

            }


            demon.victors.forEach(
                function(victor) {

                    const canonicalName =
                        getCanonicalPlayerName(
                            victor.name
                        );


                    const playerKey =
                        canonicalName.toLowerCase();


                    if (
                        !playerMap.has(
                            playerKey
                        )
                    ) {

                        playerMap.set(
                            playerKey,
                            {
                                name:
                                    canonicalName,

                                country:
                                    victor.country,

                                completions:
                                    []
                            }
                        );

                    }


                    const player =
                        playerMap.get(
                            playerKey
                        );


                    /*
                     * Don't count the same demon
                     * twice for one player.
                     */

                    if (
                        !player.completions.includes(
                            demon.name
                        )
                    ) {

                        player.completions.push(
                            demon.name
                        );

                    }

                }
            );

        }
    );


    return Array.from(
        playerMap.values()
    );

}


/* =====================================================
   PLAYER POINTS
===================================================== */

function calculatePlayerPoints(
    player
) {

    let total = 0;


    player.completions.forEach(
        function(completionName) {

            const demon =
                demons.find(
                    function(item) {

                        return item.name ===
                            completionName;

                    }
                );


            if (!demon) {
                return;
            }


            /*
             * Find the demon's CURRENT position.
             *
             * This means if a demon is #4 today,
             * its points are calculated from #4 today.
             */

            const currentRank =
                masterOrder.indexOf(
                    demon.name
                ) + 1;


            if (
                currentRank > 0
            ) {

                total +=
                    getDemonPoints(
                        demon,
                        currentRank
                    );

            }

        }
    );


    return total;

}


/* =====================================================
   LEADERBOARD
===================================================== */

function renderLeaderboard() {

    const leaderboard =
        document.getElementById(
            "leaderboardList"
        );


    if (!leaderboard) {
        return;
    }


    leaderboard.innerHTML = "";


    /*
     * This ALWAYS uses all players.
     */

    const players =
        getAllPlayers();


    const rankedPlayers =
        players
            .map(
                function(player) {

                    return {

                        name:
                            player.name,

                        country:
                            player.country,

                        completions:
                            player.completions,

                        points:
                            calculatePlayerPoints(
                                player
                            )

                    };

                }
            )
            .sort(
                function(a, b) {

                    /*
                     * Highest points first.
                     */

                    if (
                        b.points !==
                        a.points
                    ) {

                        return (
                            b.points -
                            a.points
                        );

                    }


                    /*
                     * Tie breaker:
                     * more completed demons.
                     */

                    if (
                        b.completions.length !==
                        a.completions.length
                    ) {

                        return (
                            b.completions.length -
                            a.completions.length
                        );

                    }


                    return a.name.localeCompare(
                        b.name
                    );

                }
            );


    rankedPlayers.forEach(
        function(player, index) {

            const rank =
                index + 1;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "player-card";


            card.innerHTML = `

                <div class="player-rank">
                    #${rank}
                </div>


                <div class="player-info">

                    <div class="player-name">
                        ${player.country}
                        ${player.name}
                    </div>


                    <div class="player-completions">
                        ${player.completions.length}
                        completed demons
                    </div>

                </div>


                <div class="player-points">
                    ${player.points.toFixed(2)}
                    Points
                </div>

            `;


            leaderboard.appendChild(
                card
            );

        }
    );

}

    );


const timeTravelPanel =
    document.getElementById(
        "timeTravelPanel"
    );


const leaderboardButton =

    );

   LEADERBOARD BUTTON
===================================================== */

leaderboardButton.addEventListener(

    function() {

        if (
            leaderboardPanel.style.display ===
            "block"
        ) {

            leaderboardPanel.style.display =
                "none";

        } else {

            timeTravelPanel.style.display =
                "none";

            /*
             * Always rebuild the leaderboard
             * from the complete database.
             */

            renderLeaderboard();

        }

    }
);


/* =====================================================
   TRAVEL TO DATE
===================================================== */

function travelToDate(
    selectedDate
) {

    renderList(
        selectedDate
    );


    const status =
        document.getElementById(
            "timeTravelStatus"
        );


    if (
        selectedDate ===
        todayString
    ) {

        status.style.display =
            "none";

    } else {

        const date =
            new Date(
                selectedDate +
                "T00:00:00"
            );


        const formatted =
            date.toLocaleDateString(
                "en-US",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );


        status.style.display =
            "block";


        status.textContent =
            "Viewing the FiDemonlist from " +
            formatted;

    }


    document.getElementById(
        "search"
    ).value = "";

}


/* =====================================================
   TRAVEL
===================================================== */

document.getElementById(
    "applyDate"
).addEventListener(
    "click",
    function() {

        if (
            datePicker.value
        ) {

            travelToDate(
                datePicker.value
            );

        }

    }
);


/* =====================================================
   TODAY
===================================================== */

document.getElementById(
    "returnToday"
).addEventListener(
    "click",
    function() {

        datePicker.value =
            todayString;


        travelToDate(
            todayString
        );

    }
);


/* =====================================================
   SEARCH
===================================================== */

document.getElementById(
    "search"
).addEventListener(
    "input",
    function() {

        const text =
            this.value.toLowerCase();


        const cards =
            document.querySelectorAll(
                "#demonList .demon"
            );


        cards.forEach(
            function(card) {

                const name =
                    card.dataset.name
                        .toLowerCase();


                if (
                    name.includes(text)
                ) {

                    card.style.display =
                        "block";

                } else {

                    card.style.display =
                        "none";

                }

            }
        );

    }
);


/* =====================================================
   START
===================================================== */

travelToDate(
    todayString
);


/*
 * Build the leaderboard immediately,
 * even though its panel is hidden.
 */

renderLeaderboard();

</script>
