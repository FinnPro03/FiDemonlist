<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiDemonlist</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111111;
            color: white;
        }

        header {
            position: relative;
            background: #1b1b1b;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid #333333;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            margin: 7px 0 0;
            color: #aaaaaa;
            font-size: 15px;
        }

        .header-buttons {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 8px;
        }

        .header-button {
            padding: 11px 16px;
            border: 1px solid #444444;
            border-radius: 8px;
            background: #292929;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .header-button:hover {
            background: #383838;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333333;
            background: #1c1c1c;
            color: white;
            font-size: 16px;
            margin-bottom: 25px;
            outline: none;
        }

        .search::placeholder {
            color: #777777;
        }

        .panel {
            display: none;
            background: #1c1c1c;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .panel h2 {
            margin-top: 0;
            text-align: center;
        }

        .panel-description {
            color: #aaaaaa;
            text-align: center;
        }

        .date-input {
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #444444;
            background: #111111;
            color: white;
            font-size: 16px;
            margin: 10px;
        }

        .panel-buttons {
            text-align: center;
        }

        .apply-button,
        .today-button,
        .back-button {
            padding: 12px 18px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .apply-button {
            border: none;
            background: #444444;
            color: white;
        }

        .apply-button:hover {
            background: #555555;
        }

        .today-button {
            border: 1px solid #444444;
            background: #222222;
            color: white;
            margin-left: 5px;
        }

        .today-button:hover {
            background: #333333;
        }

        .back-button {
            border: 1px solid #444444;
            background: #292929;
            color: white;
            margin-bottom: 22px;
        }

        .back-button:hover {
            background: #383838;
        }

        .time-travel-status {
            display: none;
            text-align: center;
            color: #aaaaaa;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .section-title {
            text-align: center;
            font-size: 28px;
            margin: 0 0 10px;
        }

        .section-description {
            text-align: center;
            color: #aaaaaa;
            margin: 0 0 25px;
        }

        .demon {
            background: #1c1c1c;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .image-container {
            width: 100%;
            max-width: 600px;
            height: 280px;
            margin: 0 auto 18px;
            background: #333333;
            border-radius: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .demon-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .placeholder {
            color: #aaaaaa;
            font-size: 24px;
            font-weight: bold;
        }

        .name {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .info {
            color: #aaaaaa;
            font-size: 15px;
            margin: 6px 0;
        }

        .estimate-rank {
            color: white;
            font-size: 17px;
            font-weight: bold;
            margin-top: 12px;
        }

        .no-demons {
            display: none;
            text-align: center;
            padding: 50px 20px;
            background: #1c1c1c;
            border: 1px solid #333333;
            border-radius: 12px;
            color: #888888;
            font-size: 18px;
        }

        @media (max-width: 700px) {
            header {
                padding: 25px 12px 90px;
            }

            header h1 {
                font-size: 30px;
            }

            .header-buttons {
                top: auto;
                bottom: 15px;
                right: 0;
                left: 0;
                transform: none;
                justify-content: center;
                flex-wrap: wrap;
            }

            .header-button {
                padding: 10px 13px;
                font-size: 13px;
            }

            .image-container {
                height: 220px;
            }

            .name {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>FiDemonlist</h1>
    <p>Geometry Dash Demonlist by FinnPro03 on GitHub.</p>

    <div class="header-buttons">
        <button class="header-button" id="timeTravelButton">
            Time Travel
        </button>

        <button class="header-button" id="upcomingLevelsButton">
            Upcoming Levels
        </button>
    </div>
</header>

<div class="container">

    <!-- MAIN DEMONLIST SECTION -->

    <div id="mainSection">

        <div class="panel" id="timeTravelPanel">
            <h2>Time Travel</h2>

            <p class="panel-description">
                Choose a date to see the FiDemonlist from that date.
            </p>

            <div class="panel-buttons">
                <input
                    type="date"
                    id="datePicker"
                    class="date-input"
                >

                <button class="apply-button" id="applyDate">
                    Travel
                </button>

                <button class="today-button" id="returnToday">
                    Today
                </button>
            </div>
        </div>

        <div class="time-travel-status" id="timeTravelStatus"></div>

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search demons..."
        >

        <div id="demonList"></div>

        <div class="no-demons" id="noDemons">
            No demons were on the list at this date.
        </div>

    </div>

    <!-- UPCOMING LEVELS SECTION -->

    <div id="upcomingSection" style="display: none;">

        <button class="back-button" id="goBackButton">
            ← Go Back
        </button>

        <h2 class="section-title">Upcoming Levels</h2>

        <p class="section-description">
            Levels that could enter the FiDemonlist in the future.
        </p>

        <input
            id="upcomingSearch"
            class="search"
            type="text"
            placeholder="Search upcoming levels..."
        >

        <div id="upcomingList"></div>

        <div class="no-demons" id="noUpcomingLevels">
            No upcoming levels found.
        </div>

    </div>

</div>

/* =====================================================
   TIME AGO
===================================================== */

function getTimeAgo(date, selectedDate) {
    const now = new Date(selectedDate + "T00:00:00");
    const difference = now.getTime() - date.getTime();

    if (difference < 0) {
        return "Not Verified Yet";
    }

    const totalDays = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    const totalWeeks = Math.floor(totalDays / 7);
    const totalMonths = Math.floor(totalDays / 30.4375);
    const totalYears = Math.floor(totalDays / 365.2425);

    if (totalYears >= 1) {
        return totalYears +
            (totalYears === 1 ? " Year Ago" : " Years Ago");
    }

    if (totalMonths >= 1) {
        return totalMonths +
            (totalMonths === 1 ? " Month Ago" : " Months Ago");
    }

    if (totalWeeks >= 1) {
        return totalWeeks +
            (totalWeeks === 1 ? " Week Ago" : " Weeks Ago");
    }

    if (totalDays >= 1) {
        return totalDays +
            (totalDays === 1 ? " Day Ago" : " Days Ago");
    }

    return "Today";
}


/* =====================================================
   DEMON EXISTS
===================================================== */

function demonExists(demon, selectedDate) {
    if (selectedDate < demon.verification) {
        return false;
    }

    if (demon.fallOff && selectedDate >= demon.fallOff) {
        return false;
    }

    return true;
}


/* =====================================================
   GET AVAILABLE DEMONS
===================================================== */

function getAvailableDemons(selectedDate) {
    const currentDemons = masterOrder
        .map(function(name) {
            return demons.find(function(demon) {
                return demon.name === name;
            });
        })
        .filter(function(demon) {
            return demon &&
                !demon.historical &&
                demonExists(demon, selectedDate);
        });

    const historicalDemons = historicalOrder
        .map(function(name) {
            return demons.find(function(demon) {
                return demon.name === name;
            });
        })
        .filter(function(demon) {
            return demon &&
                demon.historical &&
                demonExists(demon, selectedDate);
        });

    return [
        ...currentDemons,
        ...historicalDemons
    ];
}


/* =====================================================
   RENDER MAIN LIST
===================================================== */

function renderList(selectedDate) {
    const list = document.getElementById("demonList");
    const noDemons = document.getElementById("noDemons");

    list.innerHTML = "";

    const availableDemons = getAvailableDemons(selectedDate);

    noDemons.style.display =
        availableDemons.length === 0 ? "block" : "none";

    availableDemons.forEach(function(demon, index) {
        const rank = index + 1;
        const card = document.createElement("div");

        card.className = "demon";
        card.dataset.name = demon.name;

        card.innerHTML = `
            <div class="image-container">
                <img
                    class="demon-image"
                    src="${demon.image}"
                    alt="${demon.name}"
                >
            </div>

            <div class="name">
                #${rank} - ${demon.name}
            </div>

            <div class="info">
                Created By: ${demon.createdBy}
            </div>

            <div class="info">
                Verified By: ${demon.verifiedBy}
            </div>

            <div class="info">
                Verified: ${getTimeAgo(
                    new Date(demon.verification + "T00:00:00"),
                    selectedDate
                )}
            </div>
        `;

        const image = card.querySelector(".demon-image");

        image.onerror = function() {
            image.replaceWith(
                createPlaceholder("Image unavailable")
            );
        };

        list.appendChild(card);
    });

    applyMainSearch();
}


/* =====================================================
   IMAGE PLACEHOLDER
===================================================== */

function createPlaceholder(message) {
    const placeholder = document.createElement("div");

    placeholder.className = "placeholder";
    placeholder.textContent = message;

    return placeholder;
}


/* =====================================================
   RENDER UPCOMING LEVELS
===================================================== */

function renderUpcomingLevels() {
    const list = document.getElementById("upcomingList");
    const noLevels = document.getElementById("noUpcomingLevels");

    list.innerHTML = "";

    noLevels.style.display =
        upcomingLevels.length === 0 ? "block" : "none";

    upcomingLevels.forEach(function(level, index) {
        const card = document.createElement("div");

        card.className = "demon";
        card.dataset.name = level.name;

        const imageContainer = document.createElement("div");
        imageContainer.className = "image-container";

        const image = document.createElement("img");
        image.className = "demon-image";
        image.src = level.image || "";
        image.alt = level.name;

        image.onerror = function() {
            image.replaceWith(
                createPlaceholder("Image unavailable")
            );
        };

        if (!level.image) {
            image.replaceWith(
                createPlaceholder("No image provided")
            );
        }

        imageContainer.appendChild(image);

        // If the image was replaced because it was missing,
        // keep the placeholder inside the image container.
        if (!level.image) {
            imageContainer.innerHTML = "";
            imageContainer.appendChild(
                createPlaceholder("No image provided")
            );
        }

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = level.name;

        const creator = document.createElement("div");
        creator.className = "info";
        creator.textContent =
            "Created By: " + (level.createdBy || "Unknown");

        const verifier = document.createElement("div");
        verifier.className = "info";
        verifier.textContent =
            "Verified By: " + (level.verifier || "TBD");

        const estimate = document.createElement("div");
        estimate.className = "estimate-rank";
        estimate.textContent =
            "Estimated Rank: " + (level.estimateRank || "TBD");

        card.appendChild(imageContainer);
        card.appendChild(name);
        card.appendChild(creator);
        card.appendChild(verifier);
        card.appendChild(estimate);

        list.appendChild(card);
    });

    applyUpcomingSearch();
}

/* =====================================================
   TRAVEL
===================================================== */

function travelToDate(selectedDate) {
    renderList(selectedDate);

    const status =
        document.getElementById("timeTravelStatus");

    if (selectedDate === todayString) {
        status.style.display = "none";
    } else {
        const date = new Date(selectedDate + "T00:00:00");

        const formatted = date.toLocaleDateString("en-US", {
            year: "numeric",
            month: "long",
            day: "numeric"
        });

        status.style.display = "block";
        status.textContent =
            "Viewing the FiDemonlist from " + formatted;
    }

    document.getElementById("search").value = "";

    applyMainSearch();
}

/* =====================================================
   MAIN LIST SEARCH
===================================================== */

const mainSearch = document.getElementById("search");

function applyMainSearch() {
    const searchText = mainSearch.value.toLowerCase().trim();

    const cards = document.querySelectorAll("#demonList .demon");

    cards.forEach(function(card) {
        const name = card.dataset.name.toLowerCase();

        card.style.display =
            name.includes(searchText) ? "block" : "none";
    });
}


mainSearch.addEventListener("input", function() {
    applyMainSearch();
});


/* =====================================================
   UPCOMING LEVELS SEARCH
===================================================== */

const upcomingSearch = document.getElementById("upcomingSearch");

function applyUpcomingSearch() {
    const searchText = upcomingSearch.value.toLowerCase().trim();

    const cards = document.querySelectorAll("#upcomingList .demon");

    let visibleCount = 0;

    cards.forEach(function(card) {
        const name = card.dataset.name.toLowerCase();
        const matches = name.includes(searchText);

        card.style.display = matches ? "block" : "none";

        if (matches) {
            visibleCount++;
        }
    });

    document.getElementById("noUpcomingLevels").style.display =
        visibleCount === 0 ? "block" : "none";
}


upcomingSearch.addEventListener("input", function() {
    applyUpcomingSearch();
});

travelToDate(todayString);
