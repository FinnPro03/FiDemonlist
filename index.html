<html lang="en">

<title>FiDemonlist</title>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111111;
        color: white;
    }
    header {
        position: relative;
        background: #1b1b1b;
        padding: 25px 20px;
        text-align: center;
        border-bottom: 2px solid #333333;
    }
    header h1 {
        margin: 0;
        font-size: 38px;
    }
    header p {
        margin: 7px 0 0;
        color: #aaaaaa;
        font-size: 15px;
    }
    .header-buttons {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        gap: 8px;
    }
    .header-button {
        padding: 11px 16px;
        border: 1px solid #444444;
        border-radius: 8px;
        background: #292929;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .header-button:hover {
        background: #383838;
    }
    .container {
        max-width: 900px;
        margin: 30px auto;
        padding: 0 20px;
    }
    .search {
        width: 100%;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #333333;
        background: #1c1c1c;
        color: white;
        font-size: 16px;
        margin-bottom: 25px;
        outline: none;
    }
    .search::placeholder {
        color: #777777;
    }
    .panel {
        display: none;
        background: #1c1c1c;
        border: 1px solid #333333;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 25px;
    }
    .panel h2 {
        margin-top: 0;
        text-align: center;
    }
    .panel-description {
        color: #aaaaaa;
        text-align: center;
    }
    .date-input {
        padding: 12px;
        border-radius: 7px;
        border: 1px solid #444444;
        background: #111111;
        color: white;
        font-size: 16px;
        margin: 10px;
    }
    .panel-buttons {
        text-align: center;
    }
    .apply-button,
    .today-button {
        padding: 12px 18px;
        border-radius: 7px;
        font-weight: bold;
        cursor: pointer;
    }
    .apply-button {
        border: none;
        background: #444444;
        color: white;
    }
    .apply-button:hover {
        background: #555555;
    }
    .today-button {
        border: 1px solid #444444;
        background: #222222;
        color: white;
        margin-left: 5px;
    }
    .today-button:hover {
        background: #333333;
    }
    .time-travel-status {
        display: none;
        text-align: center;
        color: #aaaaaa;
        margin-bottom: 20px;
        font-size: 14px;
    }
    .demon {
        background: #1c1c1c;
        border: 1px solid #333333;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        text-align: center;
    }
    .image-container {
        width: 100%;
        max-width: 600px;
        height: 280px;
        margin: 0 auto 18px auto;
        background: #333333;
        border-radius: 9px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }
    .demon-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }
    .placeholder {
        color: #aaaaaa;
        font-size: 24px;
        font-weight: bold;
    }
    .name {
        font-size: 25px;
        font-weight: bold;
        margin-bottom: 12px;
    }
    .info {
        color: #aaaaaa;
        font-size: 15px;
        margin: 6px 0;
    }
    .points {
        color: white;
        font-size: 15px;
        margin-top: 10px;
        font-weight: bold;
    }
    .victors-button {
        margin: 5px;
        padding: 10px 17px;
        border: 1px solid #444444;
        border-radius: 7px;
        background: #292929;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .victors-button:hover {
        background: #383838;
    }
    .victors-panel {
        display: none;
        margin-top: 15px;
        padding: 15px;
        background: #151515;
        border: 1px solid #333333;
        border-radius: 9px;
        text-align: left;
    }
    .victors-title {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 10px;
        text-align: center;
    }
    .victor {
        padding: 8px 0;
        border-bottom: 1px solid #292929;
        color: #dddddd;
        font-size: 15px;
    }
    .victor:last-child {
        border-bottom: none;
    }
    .leaderboard-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .player-card {
        display: flex;
        align-items: center;
        background: #222222;
        border: 1px solid #333333;
        border-radius: 10px;
        padding: 15px;
    }
    .player-rank {
        width: 55px;
        font-size: 23px;
        font-weight: bold;
        text-align: center;
    }
    .player-info {
        flex: 1;
        margin-left: 10px;
    }
    .player-name {
        font-size: 18px;
        font-weight: bold;
    }
    .player-completions {
        margin-top: 5px;
        color: #999999;
        font-size: 13px;
    }
    .player-points {
        font-size: 18px;
        font-weight: bold;
        text-align: right;
    }
    .no-demons {
        display: none;
        text-align: center;
        padding: 50px 20px;
        background: #1c1c1c;
        border: 1px solid #333333;
        border-radius: 12px;
        color: #888888;
        font-size: 18px;
    }
    /* ============================
       HISTORY
    ============================ */
    .history-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.78);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        z-index: 9999;
    }
    .history-box {
        background: #1c1c1c;
        border: 1px solid #444444;
        border-radius: 14px;
        padding: 25px;
        width: 100%;
        max-width: 700px;
        max-height: 85vh;
        overflow-y: auto;
    }
    .history-box h2 {
        margin-top: 0;
        text-align: center;
        font-size: 28px;
    }
    .history-section {
        border-top: 1px solid #333333;
        margin-top: 20px;
        padding-top: 20px;
    }
    .history-section h3 {
        margin-top: 0;
        text-align: center;
    }
    .history-event {
        margin: 12px 0;
        border: 1px solid #333333;
        border-radius: 9px;
        overflow: hidden;
    }
    .history-date {
        text-align: center;
        background: #242424;
        padding: 9px;
        font-size: 14px;
        font-weight: bold;
        color: #dddddd;
    }
    .history-event-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        gap: 15px;
    }
    .history-reason {
        flex: 1;
        text-align: left;
        font-weight: bold;
    }
    .history-position {
        min-width: 90px;
        text-align: right;
        font-size: 18px;
        font-weight: bold;
    }
    .history-placed {
        color: #f0c94a;
    }
    .history-higher {
        color: #55d66b;
    }
    .history-lower {
        color: #ff5555;
    }
    .close-history {
        display: block;
        margin: 20px auto 0;
        padding: 10px 18px;
        border: 1px solid #444444;
        border-radius: 7px;
        background: #292929;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
    .close-history:hover {
        background: #383838;
    }
    @media (max-width: 700px) {
        header {
            padding-bottom: 85px;
        }
        header h1 {
            font-size: 30px;
        }
        .header-buttons {
            top: auto;
            bottom: 15px;
            right: 0;
            left: 0;
            transform: none;
            justify-content: center;
        }
        .header-button {
            padding: 10px 13px;
        }
        .player-card {
            padding: 12px;
        }
        .player-points {
            font-size: 15px;
        }
        .history-event-row {
            padding: 10px;
        }
        .history-reason {
            font-size: 13px;
        }
        .history-position {
            font-size: 16px;
            min-width: 65px;
        }

    11: 182.73,
    12: 171.91,
    13: 161.99,
    14: 152.89,
    15: 144.56
};
/* =====================================================
   TIME AGO
===================================================== */
function getTimeAgo(date) {
    const now = new Date();
    const difference = now - date;
    const totalDays =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );
    const totalWeeks =
        Math.floor(totalDays / 7);
    const totalMonths =
        Math.floor(totalDays / 30.4375);
    const totalYears =
        Math.floor(totalDays / 365.2425);
    if (totalYears >= 1) {
        return totalYears +
            (
                totalYears === 1
                    ? " Year Ago"
                    : " Years Ago"
            );
    }
    if (totalMonths >= 1) {
        return totalMonths +
            (
                totalMonths === 1
                    ? " Month Ago"
                    : " Months Ago"
            );
    }
    if (totalWeeks >= 1) {
        return totalWeeks +
            (
                totalWeeks === 1
                    ? " Week Ago"
                    : " Weeks Ago"
            );
    }
    if (totalDays >= 1) {
        return totalDays +
            (
                totalDays === 1
                    ? " Day Ago"
                    : " Days Ago"
            );
    }
    return "Today";
}
/* =====================================================
   CHECK IF DEMON EXISTS
===================================================== */
function demonExists(
    demon,
    selectedDate
) {
    if (
        selectedDate < demon.verification
    ) {
        return false;
    }
    if (
        demon.legacyDate &&
        selectedDate >= demon.legacyDate
    ) {
        return false;
    }
    return true;
}
/* =====================================================
   GET AVAILABLE DEMONS
===================================================== */
function getAvailableDemons(
    selectedDate
) {
    return masterOrder
        .map(function(name) {
            return demons.find(function(demon) {
                return demon.name === name;
            });
        })
        .filter(function(demon) {
            return demon &&
                demonExists(
                    demon,
                    selectedDate
                );
        });
}
/* =====================================================
   GET POINTS
===================================================== */
function getDemonPoints(
    demon,
    rank
) {
    if (demon.legacyDate) {
        return demon.points;
    }
    if (
        currentRankPoints[rank] !== undefined
    ) {
        return currentRankPoints[rank];
    }
    return demon.points || 0;
}
/* =====================================================
   DATE FORMAT
===================================================== */
function formatDate(dateString) {
    return new Date(
        dateString + "T00:00:00"
    ).toLocaleDateString(
        "en-US",
        {
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );
}
/* =====================================================
   GET POSITION ON A DATE
===================================================== */
function getPosition(
    demonName,
    date
) {
    const available =
        getAvailableDemons(date);
    const index =
        available.findIndex(function(demon) {
            return demon.name === demonName;
        });
    if (index === -1) {
        return null;
    }
    return index + 1;
}
/* =====================================================
   GET ALL IMPORTANT HISTORY DATES
===================================================== */
function getHistoryDates() {
    const dates = new Set();
    demons.forEach(function(demon) {
        dates.add(demon.verification);
        if (demon.legacyDate) {
            dates.add(demon.legacyDate);
        }
    });
    return Array.from(dates).sort();
}
/* =====================================================
   FIND WHAT CAUSED A POSITION CHANGE
===================================================== */
function getPositionChangeReason(
    demon,
    previousDate,
    currentDate,
    oldPosition,
    newPosition
) {
    const candidates = demons
        .filter(function(other) {
            if (
                other.name === demon.name
            ) {
                return false;
            }
            return (
                other.verification === currentDate
            );
        });
    /*
       If a new demon entered the list on this date,
       that is the thing that pushed existing demons.
    */
    if (candidates.length > 0) {
        const candidate =
            candidates[0];
        const candidatePosition =
            getPosition(
                candidate.name,
                currentDate
            );
        if (
            candidatePosition !== null
        ) {
            if (
                newPosition > oldPosition &&
                candidatePosition < newPosition
            ) {
                return candidate.name +
                    " Placed Above";
            }
            if (
                newPosition < oldPosition &&
                candidatePosition > newPosition
            ) {
                return candidate.name +
                    " Placed Below";
            }
        }
    }
    /*
       Legacy removal can move a demon upward.
    */
    const removed =
        demons.filter(function(other) {
            return (
                other.legacyDate === currentDate &&
                other.name !== demon.name
            );
        });
    if (removed.length > 0) {
        const removedDemon =
            removed[0];
        if (
            newPosition < oldPosition
        ) {
            return removedDemon.name +
                " Became Legacy";
        }
    }
    /*
       Fallback.
    */
    if (
        newPosition < oldPosition
    ) {
        return "Position Changed Higher";
    }
    if (
        newPosition > oldPosition
    ) {
        return "Position Changed Lower";
    }
    return "Position Unchanged";
}
/* =====================================================
   BUILD DEMON HISTORY
===================================================== */
function buildDemonHistory(
    demon
) {
    const events = [];
    const dates =
        getHistoryDates();
    let previousPosition = null;
    let previousDate = null;
    dates.forEach(function(date) {
        const position =
            getPosition(
                demon.name,
                date
            );
        if (position === null) {
            return;
        }
        /*
           First appearance = PLACED.
        */
        if (
            previousPosition === null
        ) {
            events.push({
                date: demon.verification,
                type: "placed",
                reason: "Placed",
                position: position
            });
            previousPosition =
                position;
            previousDate =
                date;
            return;
        }
        /*
           Only create an event if the actual
           position changed.
        */
        if (
            position !== previousPosition
        ) {
            let type;
            if (
                position < previousPosition
            ) {
                type = "higher";
            } else {
                type = "lower";
            }
            const reason =
                getPositionChangeReason(
                    demon,
                    previousDate,
                    date,
                    previousPosition,
                    position
                );
            events.push({
                date: date,
                type: type,
                reason: reason,
                position: position
            });
        }
        previousPosition =
            position;
        previousDate =
            date;
    });
    return events;
}
/* =====================================================
   RENDER HISTORY
===================================================== */
function showDemonHistory(
    demonName
) {
    const demon =
        demons.find(function(item) {
            return item.name === demonName;
        });
    if (!demon) {
        return;
    }
    const existing =
        document.getElementById(
            "historyOverlay"
        );
    if (existing) {
        existing.remove();
    }
    const overlay =
        document.createElement("div");
    overlay.id =
        "historyOverlay";
    overlay.className =
        "history-overlay";
    const history =
        document.createElement("div");
    history.className =
        "history-box";
    const events =
        buildDemonHistory(
            demon
        );
    let historyHTML = "";
    events.forEach(function(event) {
        let eventClass = "";
        let label = "";
        if (
            event.type === "placed"
        ) {
            eventClass =
                "history-placed";
            label =
                "🟡 " + event.reason;
        } else if (
            event.type === "higher"
        ) {
            eventClass =
                "history-higher";
            label =
                "🟢 " + event.reason;
        } else {
            eventClass =
                "history-lower";
            label =
                "🔴 " + event.reason;
        }
        historyHTML += `
            <div class="history-event">
                <div class="history-date">
                    ${formatDate(event.date)}
                </div>
                <div class="history-event-row">
                    <div class="history-reason ${eventClass}">
                        ${label}
                    </div>
                    <div class="history-position ${eventClass}">
                        #${event.position}
                    </div>
                </div>
            </div>
        `;
    });
    let legacyHTML = "";
    if (demon.legacyDate) {
        legacyHTML = `
            <div class="info">
                🏛️ Became Legacy:
                ${formatDate(demon.legacyDate)}
            </div>
        `;
    } else {
        legacyHTML = `
            <div class="info">
                🟢 Currently Active
            </div>
        `;
    }
    history.innerHTML = `
        <h2>
            ${demon.name}
        </h2>
        <div class="info">
            Created By: ${demon.createdBy}
        </div>
        <div class="info">
            Verified By: ${demon.verifiedBy}
        </div>
        <div class="info">
            📅 Verified:
            ${formatDate(demon.verification)}
        </div>
        ${legacyHTML}
        <div class="points">
            Current List Points:
            ${demon.points.toFixed(2)}
        </div>
        <div class="history-section">
            <h3>
                📊 Position History
            </h3>
            ${
                historyHTML ||
                `
                    <div class="info">
                        No position changes recorded.
                    </div>
                `
            }
        </div>
        <div class="history-section">
            <h3>
                🏆 Victors
            </h3>
            ${
                demon.victors.length === 0
                ?
                `
                    <div class="info">
                        No recorded victors.
                    </div>
                `
                :
                demon.victors.map(function(victor) {
                    return `
                        <div class="victor">
                            ${victor.country}
                            ${victor.name}
                        </div>
                    `;
                }).join("")
            }
        </div>
        <button
            class="close-history"
            id="closeHistory"
        >
            Close
        </button>
    `;
    overlay.appendChild(history);
    document.body.appendChild(overlay);
    document.getElementById(
        "closeHistory"
    ).onclick =
        function() {
            overlay.remove();
        };
    overlay.onclick =
        function(event) {
            if (
                event.target === overlay
            ) {
                overlay.remove();
            }
        };
}
/* =====================================================
   RENDER LIST
===================================================== */

                        alt="${demon.name}"
                    >
                </div>
                <div class="name">
                    #${rank} - ${demon.name}
                </div>
                <div class="info">
                    Created By: ${demon.createdBy}
                </div>
                <div class="info">
                    Verified By: ${demon.verifiedBy}
                </div>
                <div class="info">
                    Verified:
                    ${getTimeAgo(
                        new Date(
                            demon.verification +
                            "T00:00:00"
                        )
                    )}
                </div>
                <div class="points">
                    List Points:
                    ${points.toFixed(2)}
                </div>
                <button

                >

                </button>
                <button
                    class="victors-button"

                    )"
                >

                </button>
                <div class="victors-panel">
                    <div class="victors-title">
                        Victors
                    </div>
                    ${
                        demon.victors.length === 0
                        ?
                        `
                            <div class="victor">
                                No recorded victors.
                            </div>
                        `
                        :
                        demon.victors.map(
                            function(victor) {
                                return `
                                    <div class="victor">
                                        ${victor.country}
                                        ${victor.name}
                                    </div>
                                `;
                            }
                        ).join("")
                    }
                </div>
            `;
            const image =
                card.querySelector(
                    ".demon-image"
                );
            image.onerror =
                function() {
                    const container =
                        image.parentElement;
                    container.innerHTML =
                        '<div class="placeholder">Placeholder</div>';
                };
            list.appendChild(card);
        }
    );
}
/* =====================================================
   VICTORS
===================================================== */
function toggleVictors(
    button
) {
    const panel =
        button.nextElementSibling.nextElementSibling;
    if (
        panel.style.display === "block"
    ) {
        panel.style.display =
            "none";
        button.textContent =
            "Victors";
    } else {
        panel.style.display =
            "block";
        button.textContent =
            "Hide Victors";
    }
}
/* =====================================================
   GET PLAYERS
===================================================== */
function getAllPlayers() {
    const playerMap =
        new Map();
    demons.forEach(function(demon) {
        demon.victors.forEach(function(victor) {
            /*
               Case-sensitive display names are preserved,
               but player identity is normalized so
               wPopoff / Wpopoff / wpopoff cannot become
               separate leaderboard entries.
            */
            const key =
                victor.name.toLowerCase();
            if (!playerMap.has(key)) {
                playerMap.set(
                    key,
                    {
                        name:
                            victor.name,
                        country:
                            victor.country,
                        completions:
                            []
                    }
                );
            }
            const player =
                playerMap.get(key);
            /*
               Use the corrected display names.
            */
            if (
                key === "wpopoff"
            ) {
                player.name =
                    "wPopoff";
            }
            if (
                key === "dovvin"
            ) {
                player.name =
                    "dovvin";
            }
            if (
                !player.completions.includes(
                    demon.name
                )
            ) {
                player.completions.push(
                    demon.name
                );
            }
        });
    });
    return Array.from(
        playerMap.values()
    );
}
/* =====================================================
   PLAYER POINTS
===================================================== */
function calculatePlayerPoints(
    player
) {
    let total = 0;
    player.completions.forEach(
        function(completionName) {
            const demon =
                demons.find(function(item) {
                    return item.name ===
                        completionName;
                });
            if (!demon) {
                return;
            }
            const currentRank =
                masterOrder.indexOf(
                    demon.name
                ) + 1;
            total += getDemonPoints(
                demon,
                currentRank
            );
        }
    );
    return total;
}
/* =====================================================
   LEADERBOARD
===================================================== */
function renderLeaderboard() {
    const leaderboard =
        document.getElementById(
            "leaderboardList"
        );
    leaderboard.innerHTML = "";
    const rankedPlayers =
        getAllPlayers()
            .map(function(player) {
                return {
                    name:
                        player.name,
                    country:
                        player.country,
                    completions:
                        player.completions,
                    points:
                        calculatePlayerPoints(
                            player
                        )
                };
            })
            .sort(function(a, b) {
                return b.points -
                    a.points;
            });
    rankedPlayers.forEach(
        function(player, index) {
            const rank =
                index + 1;
            const card =
                document.createElement("div");
            card.className =
                "player-card";
            card.innerHTML = `
                <div class="player-rank">
                    #${rank}
                </div>
                <div class="player-info">
                    <div class="player-name">
                        ${player.country}
                        ${player.name}
                    </div>
                    <div class="player-completions">
                        ${player.completions.length}
                        completed demons
                    </div>
                </div>
                <div class="player-points">
                    ${player.points.toFixed(2)}
                    Points
                </div>
            `;
            leaderboard.appendChild(card);
        }
    );
}

    String(
        today.getDate()
    ).padStart(2, "0");

    );

datePicker.max =

datePicker.value =

/* =====================================================
   TRAVEL TO DATE
===================================================== */
function travelToDate(
    selectedDate
) {
    renderList(
        selectedDate
    );
    const status =
        document.getElementById(
            "timeTravelStatus"
        );
    if (
        selectedDate ===
        todayString
    ) {
        status.style.display =
            "none";
    } else {
        const date =
            new Date(
                selectedDate +
                "T00:00:00"
            );
        const formatted =
            date.toLocaleDateString(
                "en-US",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );
        status.style.display =
            "block";
        status.textContent =
            "Viewing the FiDemonlist from " +
            formatted;
    }
    document.getElementById(
        "search"
    ).value = "";
}
/* =====================================================
   TRAVEL
===================================================== */
document.getElementById(
    "applyDate"
).addEventListener(
    "click",
    function() {

            datePicker.value
        ) {
            travelToDate(
                datePicker.value
            );
        }
    }
);
/* =====================================================
   TODAY
===================================================== */
document.getElementById(
    "returnToday"
).addEventListener(
    "click",

            todayString;
        travelToDate(
            todayString
        );
    }
);

   SEARCH
===================================================== */
document.getElementById(
    "search"
).addEventListener(

            this.value.toLowerCase();
        const cards =
            document.querySelectorAll(
                "#demonList .demon"
            );
        cards.forEach(function(card) {
            const name =
                card.dataset.name
                    .toLowerCase();
            if (
                name.includes(text)
            ) {
                card.style.display =
                    "block";
            } else {
                card.style.display =
                    "none";
            }
        });
    }
);
/* =====================================================
   START
===================================================== */
travelToDate(
    todayString
);
renderLeaderboard();
