<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FiDemonlist</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111111;
            color: white;
        }

        /* ==============================
           HEADER
        ============================== */

        header {
            position: relative;
            background: #1b1b1b;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid #333333;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            margin: 7px 0 0;
            color: #aaaaaa;
            font-size: 15px;
        }

        .header-buttons {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);

            display: flex;
            gap: 8px;
        }

        .header-button {
            padding: 11px 16px;

            border: 1px solid #444444;
            border-radius: 8px;

            background: #292929;
            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .header-button:hover {
            background: #383838;
        }

        /* ==============================
           CONTAINER
        ============================== */

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* ==============================
           SEARCH
        ============================== */

        .search {
            width: 100%;
            padding: 15px;

            border-radius: 8px;
            border: 1px solid #333333;

            background: #1c1c1c;
            color: white;

            font-size: 16px;
            margin-bottom: 25px;

            outline: none;
        }

        .search::placeholder {
            color: #777777;
        }

        /* ==============================
           PANELS
        ============================== */

        .panel {
            display: none;

            background: #1c1c1c;
            border: 1px solid #333333;
            border-radius: 12px;

            padding: 20px;
            margin-bottom: 25px;
        }

        .panel h2 {
            margin-top: 0;
            text-align: center;
        }

        .panel-description {
            color: #aaaaaa;
            text-align: center;
        }

        /* ==============================
           TIME TRAVEL
        ============================== */

        .date-input {
            padding: 12px;

            border-radius: 7px;
            border: 1px solid #444444;

            background: #111111;
            color: white;

            font-size: 16px;
            margin: 10px;
        }

        .panel-buttons {
            text-align: center;
        }

        .apply-button,
        .today-button {
            padding: 12px 18px;

            border-radius: 7px;

            font-weight: bold;
            cursor: pointer;
        }

        .apply-button {
            border: none;
            background: #444444;
            color: white;
        }

        .apply-button:hover {
            background: #555555;
        }

        .today-button {
            border: 1px solid #444444;
            background: #222222;
            color: white;

            margin-left: 5px;
        }

        .today-button:hover {
            background: #333333;
        }

        .time-travel-status {
            display: none;

            text-align: center;
            color: #aaaaaa;

            margin-bottom: 20px;

            font-size: 14px;
        }

        /* ==============================
           DEMON CARD
        ============================== */

        .demon {
            background: #1c1c1c;

            border: 1px solid #333333;
            border-radius: 12px;

            padding: 20px;
            margin-bottom: 20px;

            text-align: center;
        }

        .image-container {
            width: 100%;
            max-width: 600px;

            height: 280px;

            margin: 0 auto 18px auto;

            background: #333333;

            border-radius: 9px;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .demon-image {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }

        .placeholder {
            color: #aaaaaa;

            font-size: 24px;
            font-weight: bold;
        }

        .name {
            font-size: 25px;
            font-weight: bold;

            margin-bottom: 12px;
        }

        .info {
            color: #aaaaaa;

            font-size: 15px;

            margin: 6px 0;
        }

        .points {
            color: white;

            font-size: 15px;

            margin-top: 10px;

            font-weight: bold;
        }

        /* ==============================
           VICTORS BUTTON
        ============================== */

        .victors-button {
            margin-top: 15px;

            padding: 10px 17px;

            border: 1px solid #444444;
            border-radius: 7px;

            background: #292929;
            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .victors-button:hover {
            background: #383838;
        }

        /* ==============================
           VICTORS PANEL
        ============================== */

        .victors-panel {
            display: none;

            margin-top: 15px;

            padding: 15px;

            background: #151515;

            border: 1px solid #333333;

            border-radius: 9px;

            text-align: left;
        }

        .victors-title {
            font-size: 16px;
            font-weight: bold;

            margin-bottom: 10px;

            text-align: center;
        }

        .victor {
            padding: 8px 0;

            border-bottom: 1px solid #292929;

            color: #dddddd;

            font-size: 15px;
        }

        .victor:last-child {
            border-bottom: none;
        }

        /* ==============================
           PLAYER LEADERBOARD
        ============================== */

        .leaderboard-list {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .player-card {
            display: flex;

            align-items: center;

            background: #222222;

            border: 1px solid #333333;

            border-radius: 10px;

            padding: 15px;
        }

        .player-rank {
            width: 55px;

            font-size: 23px;

            font-weight: bold;

            text-align: center;
        }

        .player-info {
            flex: 1;

            margin-left: 10px;
        }

        .player-name {
            font-size: 18px;

            font-weight: bold;
        }

        .player-completions {
            margin-top: 5px;

            color: #999999;

            font-size: 13px;
        }

        .player-points {
            font-size: 18px;

            font-weight: bold;

            text-align: right;
        }

        /* ==============================
           NO DEMONS
        ============================== */

        .no-demons {
            display: none;

            text-align: center;

            padding: 50px 20px;

            background: #1c1c1c;

            border: 1px solid #333333;

            border-radius: 12px;

            color: #888888;

            font-size: 18px;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 700px) {

            header {
                padding-bottom: 85px;
            }

            header h1 {
                font-size: 30px;
            }

            .header-buttons {
                top: auto;

                bottom: 15px;

                right: 0;
                left: 0;

                transform: none;

                justify-content: center;
            }

            .header-button {
                padding: 10px 13px;
            }

            .player-card {
                padding: 12px;
            }

            .player-points {
                font-size: 15px;
            }

        }

    </style>

</head>

    ============================== -->

    >

        <h2>Player Leaderboard</h2>

        <p class="panel-description">

        </p>

        <div

        ></div>

    </div>



    <div
        class="time-travel-status"

    ============================== -->

    <!-- ==============================

/* =====================================================

===================================================== */

const masterOrder = [

    "Thinking Space II",

    "Amethyst",

    "Flamewall",

    "Green Bullet",

    "Orbit",

    "Bloodbath",

/* =====================================================
   POINTERCRATE-STYLE CURRENT POINTS
===================================================== */

const currentRankPoints = {

    1: 350.00,

    2: 331.71,

    3: 313.42,

    4: 291.70,

    5: 271.78,

    6: 253.53,

    7: 236.80

};



/* =====================================================
   TIME AGO
===================================================== */

function getTimeAgo(date) {

    const now =
        new Date();


    const difference =
        now - date;


    const totalDays =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const totalWeeks =
        Math.floor(
            totalDays / 7
        );


    const totalMonths =
        Math.floor(
            totalDays / 30.4375
        );


    const totalYears =
        Math.floor(
            totalDays / 365.2425
        );


    if (totalYears >= 1) {

        return totalYears +
            (
                totalYears === 1
                    ? " Year Ago"
                    : " Years Ago"
            );

    }


    if (totalMonths >= 1) {

        return totalMonths +
            (
                totalMonths === 1
                    ? " Month Ago"
                    : " Months Ago"
            );

    }


    if (totalWeeks >= 1) {

        return totalWeeks +
            (
                totalWeeks === 1
                    ? " Week Ago"
                    : " Weeks Ago"
            );

    }


    if (totalDays >= 1) {

        return totalDays +
            (
                totalDays === 1
                    ? " Day Ago"
                    : " Days Ago"
            );

    }


    return "Today";

}



/* =====================================================
   CHECK IF DEMON EXISTS
===================================================== */

function demonExists(
    demon,
    selectedDate
) {

    if (
        selectedDate <
        demon.verification
    ) {

        return false;

    }


    if (
        demon.legacyDate &&
        selectedDate >=
        demon.legacyDate
    ) {

        return false;

    }


    return true;

}



/* =====================================================
   GET AVAILABLE DEMONS
===================================================== */

function getAvailableDemons(
    selectedDate
) {

    return masterOrder
        .map(
            function(name) {

                return demons.find(
                    function(demon) {

                        return demon.name ===
                            name;

                    }
                );

            }
        )
        .filter(
            function(demon) {

                return demon &&
                    demonExists(
                        demon,
                        selectedDate
                    );

            }
        );

}



/* =====================================================
   GET POINTS BASED ON HISTORICAL RANK
===================================================== */

function getDemonPoints(
    demon,
    rank
) {

    /*
       Legacy demons use their special
       lowered points.
    */

    if (
        demon.name === "Bloodbath"
    ) {

        return 18.65;

    }


    if (
        demon.name === "The Hell Factory"
    ) {

        return 18.10;

    }


    /*
       For demons with a known Pointercrate-style
       rank value, use the rank.

       This means historical rankings can change
       the displayed points automatically.
    */

    if (
        currentRankPoints[rank] !==
        undefined
    ) {

        return currentRankPoints[rank];

    }


    /*
       If a future rank doesn't have a point
       value yet, use the demon's stored value.
    */

    return demon.points || 0;

}



/* =====================================================
   RENDER DEMON LIST
===================================================== */

function renderList(
    selectedDate
) {

    const list =
        document.getElementById(
            "demonList"
        );


    list.innerHTML = "";


    const noDemons =
        document.getElementById(
            "noDemons"
        );


    const availableDemons =
        getAvailableDemons(
            selectedDate
        );


    if (
        availableDemons.length === 0
    ) {

        noDemons.style.display =
            "block";

        return;

    }


    noDemons.style.display =
        "none";


    availableDemons.forEach(
        function(demon, index) {

            const rank =
                index + 1;


            const points =
                getDemonPoints(
                    demon,
                    rank
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "demon";


            card.dataset.name =
                demon.name;


            card.innerHTML = `

                <div class="image-container">

                    <img
                        class="demon-image"
                        src="${demon.image}"
                        alt="${demon.name}"
                    >

                </div>


                <div class="name">
                    #${rank} - ${demon.name}
                </div>


                <div class="info">
                    Created By: ${demon.createdBy}
                </div>


                <div class="info">
                    Verified By: ${demon.verifiedBy}
                </div>


                <div class="info">
                    Verified: ${getTimeAgo(
                        new Date(
                            demon.verification +
                            "T00:00:00"
                        )
                    )}
                </div>


                <div class="points">
                    List Points: ${points.toFixed(2)}
                </div>


                <button
                    class="victors-button"
                    onclick="toggleVictors(this)"
                >
                    Victors
                </button>


                <div class="victors-panel">

                    <div class="victors-title">
                        Victors
                    </div>

                    ${
                        demon.victors.length === 0

                        ?

                        `<div class="victor">
                            No recorded victors yet.
                        </div>`

                        :

                        demon.victors.map(
                            function(victor) {

                                return `
                                    <div class="victor">
                                        ${victor.country}
                                        ${victor.name}
                                    </div>
                                `;

                            }
                        ).join("")

                    }

                </div>

            `;


            const image =
                card.querySelector(
                    ".demon-image"
                );


            image.onerror =
                function() {

                    const container =
                        image.parentElement;


                    container.innerHTML =
                        '<div class="placeholder">Placeholder</div>';

                };


            list.appendChild(
                card
            );

        }
    );

}



/* =====================================================
   VICTORS BUTTON
===================================================== */

function toggleVictors(
    button
) {

    const panel =
        button.nextElementSibling;


    if (
        panel.style.display ===
        "block"
    ) {

        panel.style.display =
            "none";

        button.textContent =
            "Victors";

    } else {

        panel.style.display =
            "block";

        button.textContent =
            "Hide Victors";

    }

}



/* =====================================================
   GET ALL PLAYERS
=====================================================

   Players are automatically collected from
   every victor list.

===================================================== */

function getAllPlayers() {

    const playerMap =
        new Map();


    demons.forEach(
        function(demon) {

            demon.victors.forEach(
                function(victor) {

                    if (
                        !playerMap.has(
                            victor.name
                        )
                    ) {

                        playerMap.set(
                            victor.name,
                            {
                                name: victor.name,
                                country: victor.country,
                                completions: []
                            }
                        );

                    }


                    playerMap.get(
                        victor.name
                    ).completions.push(
                        demon.name
                    );

                }
            );

        }
    );


    return Array.from(
        playerMap.values()
    );

}



/* =====================================================
   CALCULATE PLAYER POINTS
===================================================== */

function calculatePlayerPoints(
    player
) {

    let total =
        0;


    player.completions.forEach(
        function(completionName) {

            const demon =
                demons.find(
                    function(item) {

                        return item.name ===
                            completionName;

                    }
                );


            if (!demon) {

                return;

            }


            /*
               Find the demon's CURRENT
               position.

               Player points are based on
               the current list placement.
            */

            const currentRank =
                masterOrder.indexOf(
                    demon.name
                ) + 1;


            const points =
                getDemonPoints(
                    demon,
                    currentRank
                );


            total +=
                points;

        }
    );


    return total;

}



/* =====================================================
   RENDER PLAYER LEADERBOARD
===================================================== */

function renderLeaderboard() {

    const leaderboard =
        document.getElementById(
            "leaderboardList"
        );


    leaderboard.innerHTML = "";


    const rankedPlayers =
        getAllPlayers()
            .map(
                function(player) {

                    return {

                        name:
                            player.name,

                        country:
                            player.country,

                        completions:
                            player.completions,

                        points:
                            calculatePlayerPoints(
                                player
                            )

                    };

                }
            )
            .sort(
                function(a, b) {

                    return b.points -
                        a.points;

                }
            );


    rankedPlayers.forEach(
        function(player, index) {

            const rank =
                index + 1;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "player-card";


            card.innerHTML = `

                <div class="player-rank">
                    #${rank}
                </div>


                <div class="player-info">

                    <div class="player-name">

                        ${player.country}

                        ${player.name}

                    </div>


                    <div class="player-completions">

                        ${player.completions.length}

                        completed demons

                    </div>

                </div>


                <div class="player-points">

                    ${player.points.toFixed(2)}

                    Points

                </div>

            `;


            leaderboard.appendChild(
                card
            );

        }
    );

}

    document.getElementById(
        "timeTravelPanel"
    );


const leaderboardButton =
    document.getElementById(
        "leaderboardButton"
    );


const leaderboardPanel =
    document.getElementById(
        "leaderboardPanel"
    );



/* =====================================================
   TIME TRAVEL BUTTON
===================================================== */

timeTravelButton.addEventListener(
    "click",
    function() {

        if (
            timeTravelPanel.style.display ===
            "block"
        ) {

            timeTravelPanel.style.display =
                "none";

        } else {

            timeTravelPanel.style.display =
                "block";


            leaderboardPanel.style.display =
                "none";

        }

    }
);



/* =====================================================
   LEADERBOARD BUTTON
===================================================== */

leaderboardButton.addEventListener(
    "click",
    function() {

        if (
            leaderboardPanel.style.display ===
            "block"
        ) {

            leaderboardPanel.style.display =
                "none";

        } else {

            leaderboardPanel.style.display =
                "block";


            timeTravelPanel.style.display =
                "none";


            renderLeaderboard();

        }

    }
);



/* =====================================================
   TRAVEL TO DATE
===================================================== */

function travelToDate(
    selectedDate
) {

    renderList(
        selectedDate
    );


    const status =
        document.getElementById(
            "timeTravelStatus"
        );


    if (
        selectedDate ===
        todayString
    ) {

        status.style.display =
            "none";

    } else {

        const date =
            new Date(
                selectedDate +
                "T00:00:00"
            );


        const formatted =
            date.toLocaleDateString(
                "en-US",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );


        status.style.display =
            "block";


        status.textContent =
            "Viewing the FiDemonlist from " +
            formatted;

    }


    document.getElementById(
        "search"
    ).value = "";

}



/* =====================================================
   TRAVEL
===================================================== */

document.getElementById(
    "applyDate"
).addEventListener(
    "click",
    function() {

        if (
            datePicker.value
        ) {

            travelToDate(
                datePicker.value
            );

        }

    }
);



/* =====================================================
   TODAY
===================================================== */

document.getElementById(
    "returnToday"
).addEventListener(
    "click",
    function() {

        datePicker.value =
            todayString;


        travelToDate(
            todayString
        );

    }
);



/* =====================================================
   SEARCH
===================================================== */

document.getElementById(
    "search"
).addEventListener(
    "input",
    function() {

        const text =
            this.value.toLowerCase();


        const cards =
            document.querySelectorAll(
                "#demonList .demon"
            );


        cards.forEach(
            function(card) {

                const name =
                    card.dataset.name
                        .toLowerCase();


                if (
                    name.includes(text)
                ) {

                    card.style.display =
                        "block";

                } else {

                    card.style.display =
                        "none";

                }

            }
        );

    }
);



/* =====================================================
   START
===================================================== */

travelToDate(
    todayString
);


renderLeaderboard();

</script>

</body>
</html>
