/* =========================================================

========================================================= */
function getTodayString() {
    const now = new Date();
    return (
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(now.getDate()).padStart(2, "0")
    );
}

        window.location.search
    );

    params.get("date");

/* =========================================================
   DATE VALIDATION
========================================================= */
function validDate(date) {
    return /^\d{4}-\d{2}-\d{2}$/.test(date);
}
/* =========================================================
   DEMON EXISTENCE
========================================================= */
function demonExists(
    demon,
    date
) {
    if (
        date < demon.verification
    ) {
        return false;
    }
    if (
        demon.fallOff &&
        date >= demon.fallOff
    ) {
        return false;
    }
    return true;
}
/* =========================================================
   GET SNAPSHOT
========================================================= */
function getSnapshot(
    date
) {
    /*
        Exact snapshot.
    */
    if (
        snapshots[date]
    ) {
        return snapshots[date];
    }
    /*
        Find the newest snapshot that is
        not newer than the requested date.
    */
    const dates =
        Object.keys(
            snapshots
        )
        .filter(
            function(snapshotDate) {
                return snapshotDate <= date;
            }
        )
        .sort();
    if (
        dates.length > 0
    ) {
        return snapshots[
            dates[
                dates.length - 1
            ]
        ];
    }
    return null;
}
/* =========================================================
   GET LIST
========================================================= */
function getList(
    date
) {
    const snapshot =
        getSnapshot(date);
    let order;
    if (
        snapshot &&
        Array.isArray(
            snapshot.ranks
        )
    ) {
        order =
            snapshot.ranks;
    } else {
        order =
            masterOrder;
    }
    const result = [];
    order.forEach(
        function(name) {
            const demon =
                demons.find(
                    function(item) {
                        return item.name === name;
                    }
                );
            if (
                !demon
            ) {
                return;
            }
            if (
                demonExists(
                    demon,
                    date
                )
            ) {
                result.push(
                    demon
                );
            }
        }
    );
    /*
        Historical demons are included separately
        when the selected date falls inside their
        active period.
    */
    historicalOrder.forEach(
        function(name) {
            const demon =
                demons.find(
                    function(item) {
                        return item.name === name;
                    }
                );
            if (
                !demon
            ) {
                return;
            }
            if (
                demonExists(
                    demon,
                    date
                )
            ) {
                if (
                    !result.some(
                        function(item) {
                            return item.name ===
                                demon.name;
                        }
                    )
                ) {
                    result.push(
                        demon
                    );
                }
            }
        }
    );
    return result;
}
/* =========================================================
   GET POINTS
========================================================= */
function getPoints(
    demon,
    rank,
    date
) {
    const snapshot =
        getSnapshot(date);
    if (
        snapshot &&
        snapshot.points &&
        snapshot.points[demon.name] !==
        undefined
    ) {
        return snapshot.points[
            demon.name
        ];
    }
    if (
        demon.historical
    ) {
        return 0;
    }
    if (
        currentRankPoints[rank] !==
        undefined
    ) {
        return currentRankPoints[rank];
    }
    return demon.points || 0;
}
/* =========================================================
   FORMAT DEMON
========================================================= */
function formatDemon(
    demon,
    rank,
    date
) {
    return {
        rank: rank,
        name: demon.name,
        createdBy:
            demon.createdBy,
        verifiedBy:
            demon.verifiedBy,
        verification:
            demon.verification,
        fallOff:
            demon.fallOff || null,
        historical:
            Boolean(
                demon.historical
            ),
        points:
            Number(
                getPoints(
                    demon,
                    rank,
                    date
                )
            ),
        victors:
            demon.victors.map(
                function(victor) {
                    return {
                        name:
                            victor.name,
                        country:
                            victor.country
                    };
                }
            )
    };
}
/* =========================================================
   PLAYERS
========================================================= */
function getAllPlayers() {
    const playerMap =
        new Map();
    demons.forEach(
        function(demon) {
            demon.victors.forEach(
                function(victor) {
                    const key =
                        victor.name.toLowerCase();
                    if (
                        !playerMap.has(key)
                    ) {
                        playerMap.set(
                            key,
                            {
                                name:
                                    victor.name,
                                country:
                                    victor.country,
                                completions:
                                    []
                            }
                        );
                    }
                    playerMap.get(
                        key
                    ).completions.push(
                        demon.name
                    );
                }
            );
        }
    );
    return Array.from(
        playerMap.values()
    );
}
/* =========================================================
   PLAYER POINTS
========================================================= */
function calculatePlayerPoints(
    player,
    date
) {
    let total = 0;
    const list =
        getList(date);
    player.completions.forEach(
        function(completionName) {
            const demon =
                demons.find(
                    function(item) {
                        return item.name ===
                            completionName;
                    }
                );
            if (
                !demon
            ) {
                return;
            }
            if (
                demon.historical
            ) {
                return;
            }
            const rank =
                list.findIndex(
                    function(item) {
                        return item.name ===
                            demon.name;
                    }
                ) + 1;
            if (
                rank <= 0
            ) {
                return;
            }
            total +=
                getPoints(
                    demon,
                    rank,
                    date
                );
        }
    );
    return total;
}
/* =========================================================
   LEADERBOARD
========================================================= */
function getLeaderboard(
    date
) {
    return getAllPlayers()
        .map(
            function(player) {
                return {
                    name:
                        player.name,
                    country:
                        player.country,
                    completions:
                        player.completions.length,
                    demons:
                        player.completions,
                    points:
                        Number(
                            calculatePlayerPoints(
                                player,
                                date
                            ).toFixed(2)
                        )
                };
            }
        )
        .sort(
            function(a, b) {
                if (
                    b.points !==
                    a.points
                ) {
                    return b.points -
                        a.points;
                }
                return b.completions -
                    a.completions;
            }
        )
        .map(
            function(player, index) {
                return {
                    rank:
                        index + 1,
                    ...player
                };
            }
        );
}
/* =========================================================
   FIND DEMON
========================================================= */
function findDemon(
    name,
    date
) {
    const demon =
        demons.find(
            function(item) {
                return item.name.toLowerCase() ===
                    name.toLowerCase();
            }
        );
    if (
        !demon
    ) {
        return null;
    }
    const list =
        getList(date);
    const rank =
        list.findIndex(
            function(item) {
                return item.name ===
                    demon.name;
            }
        ) + 1;
    return {
        existsOnDate:
            demonExists(
                demon,
                date
            ),
        rank:
            rank > 0
                ? rank
                : null,
        name:
            demon.name,
        createdBy:
            demon.createdBy,
        verifiedBy:
            demon.verifiedBy,
        verification:
            demon.verification,
        fallOff:
            demon.fallOff || null,
        historical:
            Boolean(
                demon.historical
            ),
        points:
            rank > 0
                ? getPoints(
                    demon,
                    rank,
                    date
                )
                : 0,
        victors:
            demon.victors
    };
}

   BUILD COMPLETE DATA

            ),
        historicalDataNote:
            "Exact historical ranks and points require recorded snapshots. If no snapshot exists for a date, FiDemonlist uses the newest available snapshot before that date, or the current order if no earlier snapshot exists.",
        listCount:
            rankedList.length,
        list:
            rankedList,
        leaderboard:
            getLeaderboard(date),
        availableDates:
            Object.keys(
                snapshots
            ).sort(),
        timeTravelURLFormat:
            "ai.html?date=YYYY-MM-DD",
        leaderboardURLFormat:
            "ai.html?view=leaderboard",
        demonURLFormat:
            "ai.html?demon=Demon%20Name",
        generatedAt:
            new Date().toISOString()
    };
}
/* =========================================================
   BUILD DATA
========================================================= */
let data;
/*
    Demon-specific request.
*/
if (
    requestedDemon
) {
    data = {
        source:
            "FiDemonlist",
        currentDate:
            todayString,
        requestedDate:
            selectedDate,
        isToday:
            selectedDate === todayString,
        query:
            "demon",
        result:
            findDemon(
                requestedDemon,
                selectedDate
            ),
        generatedAt:
            new Date().toISOString()
    };
}
/*
    Leaderboard request.
*/
else if (
    requestedView ===
    "leaderboard"
) {
    data = {
        source:
            "FiDemonlist",
        currentDate:
            todayString,
        requestedDate:
            selectedDate,
        isToday:
            selectedDate === todayString,
        view:
            "player leaderboard",
        leaderboard:
            getLeaderboard(
                selectedDate
            ),
        generatedAt:
            new Date().toISOString()
    };
}
/*
    Normal list request.
*/
else {
    data =
        buildData(
            selectedDate
        );
}
/* =========================================================
   DISPLAY
========================================================= */
document.getElementById(
    "currentDate"
).textContent =
    todayString;
document.getElementById(
    "generatedAt"
).textContent =
    data.generatedAt;
document.getElementById(
    "output"
).textContent =
    JSON.stringify(
        data,
        null,
        2
    );
/* =========================================================
   JSON-LD
========================================================= */
const structuredData = {
    "@context":
        "https://schema.org",
    "@type":
        "Dataset",
    name:
        "FiDemonlist",
    description:
        "Machine-readable data for FiDemonlist, the Custom Geometry Dash Demonlist.",
    dateModified:
        todayString,
    temporalCoverage:
        "2015-01-01/" +
        todayString,
    url:
        window.location.href,
    variableMeasured: [
        "Demon rank",
        "Demon points",
        "Verification date",
        "Fall-off date",
        "Player completions",
        "Player points"
    ],
    isAccessibleForFree:
        true
};
document.getElementById(
    "structuredData"
).textContent =
    JSON.stringify(
        structuredData
    );
/* =========================================================
   AI-READABLE META TAGS
========================================================= */
function addMeta(
    name,
    content
) {
    const meta =
        document.createElement(
            "meta"
        );
    meta.name =
        name;
    meta.content =
        content;
    document.head.appendChild(
        meta
    );
}
addMeta(
    "fi-demonlist-current-date",
    todayString
);
addMeta(
    "fi-demonlist-requested-date",
    selectedDate
);
addMeta(
    "fi-demonlist-list-count",
    String(
        getList(
            selectedDate
        ).length
    )
);
addMeta(
    "fi-demonlist-data-format",
    "JSON"
);
/* =========================================================
   END
========================================================= */
</script>
</body>
</html>
